[package]
# Renamed from pixel-office (T2+P5). The bundle identifier in tauri.conf.json stays
# dev.cldgui.pixeloffice: the app data dir (config, SSH keys) is named after it.
name = "agent-tycoon"
version = "0.1.0"
description = "Agent Tycoon desktop app (the cld-gui office)"
edition = "2021"
publish = false

[lib]
# The _lib suffix keeps the lib name apart from the bin name (cargo#8519 on Windows).
name = "agent_tycoon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }
sha2 = "=0.10.9"

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper"] }
