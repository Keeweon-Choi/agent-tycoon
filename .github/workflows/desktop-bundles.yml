# Desktop installers (T1): the Agent Tycoon app (agent-tycoon/desktop, Tauri v2) built natively on each OS
# and uploaded as artifacts: Linux AppImage + deb, macOS dmg (arm64 and Intel), Windows NSIS setup.exe.
# Manual dispatch only, with the tag of a PUBLISHED release (agent-tycoon/release/publish.mjs publishes it first): the
# installers carry that release's signed daemon files (downloaded with gh, never built here), and a last job
# uploads the installers to that release. No secret and no signing key is used anywhere in this workflow.
# The version comes from one place, src-tauri/Cargo.toml (tauri.conf.json has no version field).
#
# UNSIGNED for now (code signing and notarization are P9). What the user sees:
#   Windows: SmartScreen "Windows protected your PC": More info -> Run anyway.
#   macOS:   "can't be opened because Apple cannot check it": right-click the app -> Open, or
#            System Settings -> Privacy & Security -> Open Anyway. A downloaded dmg may also need
#            `xattr -dr com.apple.quarantine "Agent Tycoon.app"`.
#   Linux:   no warning; `chmod +x` the AppImage (it needs FUSE 2: libfuse2) or install the .deb.
# Note: the app is Windows-first (its SSH flow uses Windows OpenSSH); Linux/macOS builds are checked
# here for "it builds and bundles", not for behaviour.

name: Desktop bundles

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag of a published release, e.g. v0.1.0-rc.2'
        type: string
        required: true
      only:
        description: 'all, or one OS (macOS minutes cost ten times Linux on a private repo)'
        type: choice
        default: all
        options: [all, linux, macos, windows]

permissions:
  contents: read

concurrency:
  group: desktop-bundles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The OS list, cut to one OS when a dispatch asks (tags build all three).
  plan:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: |
          # ubuntu-22.04, not 24.04: an AppImage built against newer glibc does not run on older distros.
          # macos-15 is Apple Silicon; macos-15-intel (the last Intel image; macos-13 is retired) builds the native x86_64 dmg.
          all='[{"os":"linux","runner":"ubuntu-22.04","bundles":"appimage,deb","files":"appimage/*.AppImage deb/*.deb"},{"os":"macos","runner":"macos-15","bundles":"dmg,app","files":"dmg/*.dmg"},{"os":"macos-intel","runner":"macos-15-intel","bundles":"dmg,app","files":"dmg/*.dmg"},{"os":"windows","runner":"windows-2025","bundles":"nsis","files":"nsis/*-setup.exe"}]'
          if [ -z "$ONLY" ] || [ "$ONLY" = all ]; then pick="$all"; else pick=$(jq -c --arg o "$ONLY" 'map(select(.os == $o or ($o == "macos" and .os == "macos-intel")))' <<< "$all"); fi
          echo "include=$pick" >> "$GITHUB_OUTPUT"

  bundle:
    needs: plan
    name: Desktop ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}

    defaults:
      run:
        shell: bash
        working-directory: agent-tycoon/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: agent-tycoon/desktop/package-lock.json

      - name: Linux build libraries
        if: matrix.os == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            patchelf pkg-config file

      # The app carries the daemon bundle for its OS (T2+P5: build.rs reads <repo>/out/bundles/<target>/ and
      # stops a release build without it): the release's own signed files, with the SHA256SUMS, its signature
      # and the public key that go with them. The key must be the one committed in this tag.
      - name: Signed daemon files of the release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          case "${{ matrix.os }}" in
            linux) targets="linux-x64" ;;
            macos) targets="darwin-arm64" ;;
            macos-intel) targets="darwin-x64" ;;
            windows) targets="win-x64 linux-x64" ;;
          esac
          for t in $targets; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "out/bundles/$t" \
              --pattern "agent-tycoon-daemon-*-$t.tar.gz" --pattern SHA256SUMS --pattern SHA256SUMS.sig --pattern agent-tycoon-release.pub
            cmp "out/bundles/$t/agent-tycoon-release.pub" agent-tycoon/release/agent-tycoon-release.pub
            node agent-tycoon/release/bundle/verify.mjs out/bundles/$t/agent-tycoon-daemon-*-$t.tar.gz "out/bundles/$t/SHA256SUMS" "out/bundles/$t/SHA256SUMS.sig" agent-tycoon/release/agent-tycoon-release.pub --os "${t%-*}" --arch "${t#*-}"
          done

      - name: Install the Tauri CLI
        run: npm ci

      - name: Build
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: List installers
        run: |
          cd src-tauri/target/release/bundle
          for f in ${{ matrix.files }}; do
            ls -l "$f"
            echo "- \`$f\`, $(wc -c < "$f" | tr -d ' ') bytes" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: agent-tycoon-${{ matrix.os }}
          path: |
            agent-tycoon/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            agent-tycoon/desktop/src-tauri/target/release/bundle/deb/*.deb
            agent-tycoon/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            agent-tycoon/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          # The download people get (owner 10-27: Actions zips, no Releases); 90 days is the maximum, and storage is free on the public repo.
          retention-days: 90

  # The installers go to the release they were built for.
  attach:
    needs: bundle
    name: Attach installers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: agent-tycoon-*
          path: installers

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # One asset per file, spaces in the name turned into dashes: the NSIS installer is
        # "Agent Tycoon_<version>_x64-setup.exe", and an unquoted $(find ...) split it (v0.1.0-rc.5).
        run: |
          # No installers (or no folder) is a failure, not a green step with nothing attached.
          [ -n "$(find installers -type f 2>/dev/null | head -n 1)" ] || { echo "no installers to attach"; exit 1; }
          find installers -type f -print0 | while IFS= read -r -d '' file; do
            name=$(basename "$file" | tr ' ' '-')
            cp "$file" "$RUNNER_TEMP/$name"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/$name"
          done
