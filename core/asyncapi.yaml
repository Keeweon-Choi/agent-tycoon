# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'
    ProjectFileListResponse:
      title: Project files HTTP list response
      payload:
        $ref: '#/components/schemas/ProjectFileList'
    ProjectFilePreviewResponse:
      title: Project files HTTP preview response
      payload:
        $ref: '#/components/schemas/ProjectFilePreview'
    ProjectRecentFilesResponse:
      title: Project files HTTP recent response
      payload:
        $ref: '#/components/schemas/ProjectRecentFiles'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        # Context window
        - $ref: '#/components/schemas/AgentContextUsage'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        - $ref: '#/components/schemas/CarpetTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/OfficeAccess'
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/BypassPermissionsUpdated'
        - $ref: '#/components/schemas/HooksStatus'
        - $ref: '#/components/schemas/HooksConsentRequest'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/AreaMappingsLoaded'
        - $ref: '#/components/schemas/DirectoriesLoaded'
        - $ref: '#/components/schemas/DirectorySaved'
        - $ref: '#/components/schemas/DirectoryRejected'
        - $ref: '#/components/schemas/DirectorySuggestions'
        # Terminal (standalone embedded terminal control plane)
        - $ref: '#/components/schemas/TerminalAvailability'
        - $ref: '#/components/schemas/TerminalSessionOpened'
        - $ref: '#/components/schemas/TerminalSessionClosed'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
        # cld-gui: character presets (T-0017)
        - $ref: '#/components/schemas/CharacterPresets'
        - $ref: '#/components/schemas/CharacterRefused'
        - $ref: '#/components/schemas/CharacterParts'
        # cld-gui: new-device approval (T-0022)
        - $ref: '#/components/schemas/DeviceApprovalRequest'
        - $ref: '#/components/schemas/DeviceApprovalClosed'
        # cld-gui: persistent device login (T-0034)
        - $ref: '#/components/schemas/NewDeviceLogin'
        # cld-gui: trusted-device terminal (T-0052)
        - $ref: '#/components/schemas/ShellNotice'
        # cld-gui: repositories and worktrees (T-0020)
        - $ref: '#/components/schemas/RepoState'
        - $ref: '#/components/schemas/RepoDiff'
        - $ref: '#/components/schemas/RepoWorktreeDetail'
        - $ref: '#/components/schemas/RepoActionResult'
        # cld-gui: the office's data (cld/docs/design/protocol.md)
        - $ref: '#/components/schemas/OfficeSnapshot'
        - $ref: '#/components/schemas/CodexTasks'
        - $ref: '#/components/schemas/TempStaff'
        - $ref: '#/components/schemas/OfficeJobs'
        - $ref: '#/components/schemas/HwSample'
        - $ref: '#/components/schemas/UsageState'
        - $ref: '#/components/schemas/CodexUsageCheckResult'
        # cld-gui: default agent rules + the user's global rules (RULES-DEFAULT)
        - $ref: '#/components/schemas/AgentRules'
        - $ref: '#/components/schemas/NewAgentPermission'
        - $ref: '#/components/schemas/GpuBoard'
        - $ref: '#/components/schemas/OfficeEvent'
        - $ref: '#/components/schemas/StatusOutput'
        - $ref: '#/components/schemas/ChatTranscript'
        - $ref: '#/components/schemas/ChatHistoryResult'
        - $ref: '#/components/schemas/ChatSearchResult'
        - $ref: '#/components/schemas/WorkContent'
        - $ref: '#/components/schemas/ChatSendResult'
        - $ref: '#/components/schemas/ChatPendingResult'
        - $ref: '#/components/schemas/PermissionAnswerResult'
        - $ref: '#/components/schemas/SlashCommandsList'
        - $ref: '#/components/schemas/MessengerContacts'
        - $ref: '#/components/schemas/GroupRooms'
        - $ref: '#/components/schemas/GroupTimeline'
        - $ref: '#/components/schemas/GroupActionResult'
        - $ref: '#/components/schemas/EzRules'
        # cld-gui: built-in engine (T-0018)
        - $ref: '#/components/schemas/EngineState'
        - $ref: '#/components/schemas/EngineActionResult'
        - $ref: '#/components/schemas/ProjectScanResult'
        - $ref: '#/components/schemas/ProjectImportResult'
        - $ref: '#/components/schemas/ProjectImportSuggestion'
        # cld-gui: engine jobs (T-0019)
        - $ref: '#/components/schemas/JobActionResult'
        # cld-gui: who is watching (T-0025)
        - $ref: '#/components/schemas/ViewerVisibilityAck'
        # cld-gui: floors (T-0027)
        - $ref: '#/components/schemas/BuildingState'
        # cld-gui: project folders (T-0032)
        - $ref: '#/components/schemas/HostInfo'
        - $ref: '#/components/schemas/FolderList'
        # cld-gui: Web Push (T-0039)
        - $ref: '#/components/schemas/PushState'
        # cld-gui: whiteboard memos (T-0065)
        - $ref: '#/components/schemas/WhiteboardMemos'
        # cld-gui: pinned conversations (U-30)
        - $ref: '#/components/schemas/PinnedConversations'
        # cld-gui: 작업 현황 (DEV-BOARD)
        - $ref: '#/components/schemas/TaskBoard'
        # cld-gui: delegation approvals (C6)
        - $ref: '#/components/schemas/DelegationApprovals'
        # cld-gui: what the agents' own work lists say (U-48 phase 1)
        - $ref: '#/components/schemas/TrackedItems'
        # cld-gui: a project's planning documents as tracked items (U-48 phase 2a)
        - $ref: '#/components/schemas/TrackingSources'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetGhostHeadlessAgents'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/HooksConsentResponse'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/SaveAreaMappings'
        - $ref: '#/components/schemas/SetShowAreas'
        - $ref: '#/components/schemas/SetBypassPermissions'
        - $ref: '#/components/schemas/SetShowHostDirectories'
        - $ref: '#/components/schemas/SaveDirectory'
        - $ref: '#/components/schemas/RemoveDirectory'
        - $ref: '#/components/schemas/RequestDirectorySuggestions'
        - $ref: '#/components/schemas/RequestDiagnostics'
        # cld-gui: character presets (T-0017)
        - $ref: '#/components/schemas/SetCharacter'
        # cld-gui: repositories and worktrees (T-0020)
        - $ref: '#/components/schemas/RepoView'
        - $ref: '#/components/schemas/RepoDiffRequest'
        - $ref: '#/components/schemas/RepoWorktreeRequest'
        - $ref: '#/components/schemas/RepoAction'
        # cld-gui: the office's data
        - $ref: '#/components/schemas/StatusView'
        - $ref: '#/components/schemas/ChatView'
        - $ref: '#/components/schemas/ChatHistory'
        - $ref: '#/components/schemas/ChatSearch'
        - $ref: '#/components/schemas/WorkView'
        - $ref: '#/components/schemas/ChatSend'
        - $ref: '#/components/schemas/ChatSendNow'
        - $ref: '#/components/schemas/ChatCancel'
        - $ref: '#/components/schemas/ChatEdit'
        - $ref: '#/components/schemas/ChatHold'
        - $ref: '#/components/schemas/PermissionAnswer'
        - $ref: '#/components/schemas/GroupView'
        - $ref: '#/components/schemas/GroupPost'
        - $ref: '#/components/schemas/GroupAction'
        - $ref: '#/components/schemas/SlashCommands'
        # cld-gui: built-in engine (T-0018)
        - $ref: '#/components/schemas/EngineAction'
        - $ref: '#/components/schemas/EngineChoicesRefresh'
        - $ref: '#/components/schemas/ProjectScan'
        - $ref: '#/components/schemas/ProjectImport'
        - $ref: '#/components/schemas/ProjectImportUndo'
        - $ref: '#/components/schemas/ProjectImportDismiss'
        # cld-gui: engine jobs (T-0019)
        - $ref: '#/components/schemas/JobAction'
        # cld-gui: who is watching (T-0025)
        - $ref: '#/components/schemas/ViewerVisibility'
        - $ref: '#/components/schemas/HwView'
        # cld-gui: floors (T-0027)
        - $ref: '#/components/schemas/AddFloor'
        - $ref: '#/components/schemas/RenameFloor'
        - $ref: '#/components/schemas/RemoveFloor'
        - $ref: '#/components/schemas/MoveToFloor'
        - $ref: '#/components/schemas/SetFloorRule'
        # cld-gui: decor (T-0053)
        - $ref: '#/components/schemas/ResetRoomDecor'
        # cld-gui: project folders (T-0032)
        - $ref: '#/components/schemas/ListFolders'
        # cld-gui: Web Push (T-0039)
        - $ref: '#/components/schemas/PushSubscribe'
        - $ref: '#/components/schemas/PushUnsubscribe'
        # cld-gui: whiteboard memos (T-0065)
        - $ref: '#/components/schemas/SetWhiteboardMemo'
        # cld-gui: pinned conversations (U-30)
        - $ref: '#/components/schemas/SetConversationPin'
        # cld-gui: 작업 현황 (DEV-BOARD)
        - $ref: '#/components/schemas/TaskEdit'
        - $ref: '#/components/schemas/CodexUsageCheck'
        - $ref: '#/components/schemas/AgentRulesRequest'
        # cld-gui: the permission mode new agents start with (O4)
        - $ref: '#/components/schemas/NewAgentPermissionRequest'
        # cld-gui: delegation approvals (C6)
        - $ref: '#/components/schemas/DelegationDecision'
        # cld-gui: a project's planning documents as tracked items (U-48 phase 2a)
        - $ref: '#/components/schemas/TrackingSettings'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        directoryName:
          type: string
        isExternal:
          type: boolean
        palette:
          type: integer
          description: Server-assigned character palette index.
        hueShift:
          type: integer
          description: Server-assigned hue shift in degrees (0-360).

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, directoryNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        directoryNames:
          type: object
          description: Map of agent ID (string) to Directory name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        desc:
          type: string
          description: The tool call's own one-line description, when it gave one.
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean
        isTeammateSpawn:
          type: boolean
          description: >-
            True when this spawn tool call carries a name, making the spawn a
            Teammate-to-be. The office must not create a Subtask sub-character
            for it — a teammate character will represent the spawn instead.
        model:
          type: string
          description: >-
            The model a sub-agent spawn asked for (the Agent/Task `model`
            input, e.g. opus, sonnet, haiku), when it names one. The office
            badges the sub-agent with it (T-0041); a spawn that inherits its
            lead's model sends none.

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer
        asker:
          description: |
            PERM-PROMPT: a confirmed permission wait of an engine session asked
            by one of its sub-agents: that sub-agent's staff name id (its
            employee's `nameId`), for the notice to name it.
          type: string

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string
        desc:
          type: string
          description: The tool call's own one-line description, when it gave one.
        model:
          type: string
          description: >-
            The model the sub-agent's own transcript names (message.model, e.g.
            claude-sonnet-5-5), when it names one: a watched spawn that asked
            for no model, or one resumed with no spawn call to read it from.

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentContextUsage:
      description: |
        How much of the agent's context window is in use, as of its most recent
        turn. A snapshot, NOT a running total: it falls when the session
        compacts or clears. `maxContextTokens` is the runtime's best estimate of
        the window size — transcripts don't state it, so it starts at the
        default and widens (never shrinks) once a larger context is observed.
        Sent for every agent, including leads and teammates; sub-agents have no
        session of their own and never report it.
      type: object
      additionalProperties: false
      required: [type, id, contextTokens, maxContextTokens]
      properties:
        type:
          const: agentContextUsage
        id:
          type: integer
        contextTokens:
          type: integer
        maxContextTokens:
          type: integer

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer. `cldBase`
                names the generated office; send it unchanged in saveLayout.
                cld-gui (T-0027): an office of several floors stacks them top
                to bottom and adds `cldFloors`, one `{id, row, rows, cols}`
                per floor (`buildingState`'s ids): rows `row` to
                `row + rows - 1` and columns 0 to `cols - 1` are that floor.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    CarpetTilesLoaded:
      description: Carpet auto-tile sprite sets (16 marching-squares pieces per variant).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: carpetTilesLoaded
        sets:
          type: array
          description: Array of carpet variants; each variant is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - ghostHeadlessAgents
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
        - showAreas
        - bypassPermissions
        - showHostDirectories
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        ghostHeadlessAgents:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        showAreas:
          type: boolean
        bypassPermissions:
          type: boolean
          description: >-
            Persistent per-host permission posture. While true, every launch on
            this host runs the CLI with its skip-permissions flag.
        showHostDirectories:
          type: boolean
          description: >-
            Persistent per-host choice whether the host's own Directories (VS
            Code's workspace folders, standalone's start directory) are listed
            in `directoriesLoaded`. Off by default.

    BypassPermissionsUpdated:
      description: |
        The host's skip-permissions posture changed (an accepted
        `setBypassPermissions`). Broadcast to every connected office, the one
        that sent it included, so every Settings toggle shows the posture the
        next launch will actually use. `enabled` is the persisted value read
        back after the write, not an echo of the request.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: bypassPermissionsUpdated
        enabled:
          type: boolean

    HooksStatus:
      description: |
        Actual hook installation state, as opposed to the hooksEnabled
        preference in SettingsLoaded. The two can disagree: hooksEnabled
        defaults to true while first-run consent is still pending and nothing
        is installed yet. Sent after the connect handshake and whenever the
        install state changes (consent granted, settings toggle, uninstall).
      type: object
      additionalProperties: false
      required: [type, providerId, installed]
      properties:
        type:
          const: hooksStatus
        providerId:
          type: string
          description: >-
            The hook provider this install state is about (HookProvider.id,
            e.g. "claude"). Consumers keyed on install state must never mix
            one provider's status into another's — the Intro's install
            verdict in particular reads only the provider it asked about.
        installed:
          type: boolean

    HooksConsentRequest:
      description: |
        Ask this client to run the first-run hooks consent dialog. Sent during the
        `webviewReady` handshake when the hooks preference is on, consent has not
        been recorded, and nothing of ours is installed — and, in standalone, only
        on privileged (tokened) connections, since an untokened spectator could not
        act on it anyway (its `hooksConsentResponse` would be ignored).

        Carries the provider being asked about and its disclosure copy so the
        client renders the server's exact terms (the provider's
        consentDisclosure(), shared with no client-side duplicate to drift).
        The client answers with `hooksConsentResponse`, echoing the providerId;
        dismissing the dialog sends nothing and the request fires again on the
        next connect. One request per provider that needs an answer.
      type: object
      additionalProperties: false
      required: [type, providerId, headline, disclosure]
      properties:
        type:
          const: hooksConsentRequest
        providerId:
          type: string
          description: >-
            The hook provider whose install is being approved (HookProvider.id).
            The client never originates this value — it echoes it back in its
            `hooksConsentResponse`.
        headline:
          type: string
          description: One-sentence summary of what is being approved.
        disclosure:
          type: string
          description: |
            Full disclosure body (what is written, what data moves, how to undo),
            paragraphs separated by blank lines.

    AreaMappingsLoaded:
      description: |
        Directory-to-Area mappings. Directory names map to one or more Area
        labels; new agents from that Directory prefer seats inside those Areas.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: areaMappingsLoaded
        mappings:
          type: object
          description: Map of Directory name (string) to array of Area labels.
          additionalProperties:
            type: array
            items:
              type: string

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    DirectoriesLoaded:
      description: |
        The Directories agents can be launched into: the union of the user-defined
        entries (machine-wide, shared by every host) and the host's own native
        context, contributed as `source: host` entries — VS Code its workspace
        folders, standalone the directory the server was started from. Deduped by
        path with the user-defined entry winning, and ordered alphabetically by
        name.

        Rebroadcast to every connected office after every Directory mutation
        (`saveDirectory`, `removeDirectory`). A client learns its own delete
        succeeded from this; a save is acked separately by `directorySaved`.
      type: object
      additionalProperties: false
      required: [type, directories]
      properties:
        type:
          const: directoriesLoaded
        directories:
          type: array
          items:
            $ref: '#/components/schemas/Directory'

    DirectorySaved:
      description: |
        A `saveDirectory` was accepted and persisted. Sent point-to-point to the
        requesting client (never broadcast), right after the `directoriesLoaded`
        rebroadcast. Carries the entry exactly as stored: the host resolves the
        path (tilde expansion, absolute resolution) and names an unnamed entry
        after the resolved basename, so `directory.name` can differ from
        anything the client typed. Area mappings are keyed by Directory name,
        so a client assigning Areas in the same save keys them by this name.
      type: object
      additionalProperties: false
      required: [type, directory]
      properties:
        type:
          const: directorySaved
        directory:
          $ref: '#/components/schemas/Directory'

    DirectoryRejected:
      description: |
        A `saveDirectory` failed host-side validation, or a `saveDirectory` /
        `removeDirectory` could not be written to the shared config. Sent
        point-to-point to the requesting client (never broadcast) and nothing
        changed on disk; the Directory modal stays open and shows `reason` inline.
      type: object
      additionalProperties: false
      required: [type, path, reason]
      properties:
        type:
          const: directoryRejected
        path:
          type: string
          description: The path exactly as submitted, before tilde expansion.
        reason:
          type: string
          description: Human-readable cause, shown inline in the Directory modal.

    DirectorySuggestions:
      description: |
        Candidate paths for the Directory modal, recovered from the working
        directories recorded in the coding agent's own session transcripts across
        every session root — places the user has already run agents in, so adding
        a Directory on a phone rarely means typing one out.

        Sent point-to-point in reply to `requestDirectorySuggestions` (never
        broadcast). Already deduped, existence-checked and stripped of anything
        already in the Directory union, so the modal renders the list as-is; an
        empty list means the modal shows no suggestions section.
      type: object
      additionalProperties: false
      required: [type, paths]
      properties:
        type:
          const: directorySuggestions
        paths:
          type: array
          description: Absolute directory paths, ordered for stable display.
          items:
            type: string

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Terminal control plane (standalone embedded terminal) ──────
    # Only the CONTROL plane lives in this contract. The terminal's raw byte
    # stream is deliberately outside it, on a dedicated WebSocket endpoint
    # (GET /terminal/:agentId): it is unstructured, high-frequency data that
    # would otherwise pass through this discriminated union and the store's
    # broadcast fan-out (which would also leak one agent's output to every
    # connected client). See docs/design/standalone-terminal.md.

    OfficeAccess:
      description: >-
        Whether this connection may change anything. A read-only office (no
        valid server token, or a Host outside the allowlist) can load and watch
        the office but every change it sends is refused, so the client hides
        the controls that would send one. Sent first on webviewReady; a client
        that never receives it is not read-only. cld-gui (T-0052): `terminal`
        is the host's --allow-terminal; false or absent hides the 터미널 tab.
      type: object
      additionalProperties: false
      required: [type, readOnly]
      properties:
        type:
          const: officeAccess
        readOnly:
          type: boolean
        terminal:
          type: boolean
        webBuild:
          type: string
          description: Normalized standalone SPA entry module, for detecting a page from an older deployment.

    TerminalAvailability:
      description: >-
        Whether this server can host embedded terminals. Standalone only; the
        VS Code surface owns its own terminals and never receives this. When
        false, the client hides terminal UI and shows `reason`.
      type: object
      additionalProperties: false
      required: [type, available]
      properties:
        type:
          const: terminalAvailability
        available:
          type: boolean
        reason:
          type: string
          description: Human-readable cause when unavailable (e.g. no PTY module installed).

    TerminalSessionOpened:
      description: >-
        A PTY-backed terminal now exists for this agent; the client may attach to
        GET /terminal/:agentId. Re-sent on webviewReady for every live session so
        a reconnecting client rebuilds its tabs.
      type: object
      additionalProperties: false
      required: [type, agentId]
      properties:
        type:
          const: terminalSessionOpened
        agentId:
          type: integer

    TerminalSessionClosed:
      description: The agent's terminal process exited; its socket is no longer attachable.
      type: object
      additionalProperties: false
      required: [type, agentId]
      properties:
        type:
          const: terminalSessionClosed
        agentId:
          type: integer
        exitCode:
          type: integer

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        directoryPath:
          type: string
          description: Path of the Directory to launch into.

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: |
        Save the office layout. With the cld office on, the daemon keeps the
        differences from the generated office as decor in
        ~/.config/cld-gui/decor.json and answers the sender with layoutLoaded.
        Otherwise, save to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetGhostHeadlessAgents:
      description: >-
        Toggle translucent rendering for headless agents (adopted sessions with no
        terminal to focus).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setGhostHeadlessAgents
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, providerId, enabled]
      properties:
        type:
          const: setHooksEnabled
        providerId:
          type: string
          description: >-
            The hook provider being toggled (HookProvider.id). The client
            echoes the id of the hooksStatus row the checkbox renders; it
            never originates one.
        enabled:
          type: boolean

    HooksConsentResponse:
      description: |
        The user's answer to `hooksConsentRequest` — an ABSOLUTE statement of
        the state the user wants, revisable from the Intro's closing step. Only
        an exact `install` grants consent and installs; only an exact `never`
        records a durable decline and persists hooks-off (uninstalling first
        when this provider's hooks are on disk from an earlier answer).
        `notNow` writes nothing on a fresh ask, but over anything an EARLIER
        answer left behind it reverts it — uninstalling a landed install,
        clearing a recorded grant or decline — so the ask genuinely returns on
        the next connect. Any unrecognized value writes NOTHING and the user is
        asked again — a malformed choice must never be read as approval, a
        durable decline, or an uninstall trigger. The server ignores this
        message on unprivileged standalone connections, which were never sent
        the request.
      type: object
      additionalProperties: false
      required: [type, providerId, choice]
      properties:
        type:
          const: hooksConsentResponse
        providerId:
          type: string
          description: >-
            The provider this answer is about, echoed verbatim from the
            `hooksConsentRequest` that solicited it. An id naming no
            registered provider is treated exactly like a junk choice:
            write nothing.
        choice:
          $ref: '#/components/schemas/HooksConsentChoice'

    HooksConsentChoice:
      description: >-
        The three consent outcomes. Receivers must treat any other value as a
        no-op: write nothing, ask again. (An exact notNow itself is a no-op
        only on a fresh ask — over an earlier answer it is a revision that
        undoes what that answer left behind.)
      type: string
      enum: [install, notNow, never]

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: >-
        Add an external asset directory. In VS Code the host shows a native
        directory picker and omits `path`; the standalone browser has no native
        picker, so it supplies an absolute `path` typed by the user.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory
        path:
          type: string
          description: Absolute directory path (standalone browser only; omitted in VS Code).

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    SaveAreaMappings:
      description: Persist Directory-to-Area mappings for seat assignment.
      type: object
      additionalProperties: false
      required: [type, mappings]
      properties:
        type:
          const: saveAreaMappings
        mappings:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    SetBypassPermissions:
      description: >-
        Persist the host's skip-permissions posture. Applied host-side when
        building the launch command; never sent per launch.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setBypassPermissions
        enabled:
          type: boolean

    SetShowHostDirectories:
      description: >-
        Persist whether the host's own Directories are listed. Answered with a
        `directoriesLoaded` broadcast of the list as it now stands. Hiding them
        only changes the list: agents launched in a host Directory are still
        named after it.
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowHostDirectories
        enabled:
          type: boolean

    SaveDirectory:
      description: |
        Add or edit a user-defined Directory. `previousPath` identifies the entry
        being edited; absent means this is a new one.

        The host expands a leading `~`, then requires the path to exist and to be
        a directory. On success it rebroadcasts `directoriesLoaded`; on failure it
        replies `directoryRejected` and persists nothing.
      type: object
      additionalProperties: false
      required: [type, name, path]
      properties:
        type:
          const: saveDirectory
        name:
          type: string
          description: Display name. Empty falls back to the path's basename.
        path:
          type: string
          description: Filesystem path; a leading `~` is expanded host-side.
        previousPath:
          type: string
          description: Path of the entry being edited. Absent when adding.

    RemoveDirectory:
      description: >-
        Delete a user-defined Directory. Agents already running in it are left
        untouched.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeDirectory
        path:
          type: string

    RequestDirectorySuggestions:
      description: >-
        Ask the host for tappable path suggestions for the Directory modal; it
        replies `directorySuggestions` to this client only. Sent when the modal
        opens, so the list reflects the sessions on disk right then.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDirectorySuggestions

    SetShowAreas:
      description: Toggle the Areas overlay (translucent rendering on top of the office).
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setShowAreas
        enabled:
          type: boolean

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    # ── Supporting schemas ─────────────────────────────────────────

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    Directory:
      description: |
        A named filesystem location agents can be launched into. `source` marks
        where the entry came from: `host` entries are contributed by the host
        (VS Code's workspace folders, standalone's start directory) and are
        read-only in the office; `user` entries are defined by the user.
      type: object
      additionalProperties: false
      required: [name, path, source]
      properties:
        name:
          type: string
        path:
          type: string
        source:
          $ref: '#/components/schemas/DirectorySource'

    DirectorySource:
      description: |
        Where a Directory came from. `host` entries are contributed by the host
        and are read-only in the office; `user` entries are defined by the user.
      type: string
      enum: [user, host]

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer
        visual:
          $ref: '#/components/schemas/FurnitureVisual'

    FurnitureVisual:
      description: >-
        GFX (owner 10-25): optional 2.5D placement and depth of a furniture picture, apart from
        its footprint (which alone decides walking, collision and placement). Absent: the picture's
        top-left stands on the footprint's top-left, as before. Numbers are world px (footAnchor:
        sprite px), within ±256.
      type: object
      additionalProperties: false
      properties:
        footAnchor:
          $ref: '#/components/schemas/FurnitureFootAnchor'
        elevation:
          type: number
        depthOffset:
          type: number
        occlusionMode:
          $ref: '#/components/schemas/FurnitureOcclusionMode'
        shadowPreset:
          type: string
        lightingPreset:
          type: string

    FurnitureFootAnchor:
      description: Sprite px of the point that stands on the footprint's bottom centre.
      type: object
      additionalProperties: false
      required:
        - x
        - y
      properties:
        x:
          type: number
        y:
          type: number

    FurnitureOcclusionMode:
      description: "'foreground': drawn after everything that stands."
      type: string
      enum:
        - default
        - foreground

    # ── cld-gui: character presets (T-0017, FR-OFC-015/016) ──────
    # Sheets in ~/.config/cld-gui/characters/ (the char_N.png format, 112×96)
    # and the look chosen per character name (~/.config/cld-gui/characters.json).

    CharacterPresets:
      description: |
        The preset sheets in the daemon's presets folder and the look chosen
        per character, re-sent in full whenever either changes. `url` and
        `mugshotUrl` (the 16×16 card portrait, when there is one) are relative
        to the page and need the login session. `assignments` is keyed by
        character name: the engine project's or the Claude session's.
      type: object
      additionalProperties: false
      required: [type, presets, assignments]
      properties:
        type:
          const: characterPresets
        presets:
          type: array
          items:
            $ref: '#/components/schemas/CharacterPreset'
        assignments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CharacterChoice'

    CharacterPreset:
      type: object
      additionalProperties: false
      required: [id, label, url, mugshotUrl]
      properties:
        id:
          type: string
        label:
          type: string
        url:
          type: string
        mugshotUrl:
          type: [string, 'null']
        density:
          $ref: '#/components/schemas/CharacterDensity'

    CharacterDensity:
      description: |
        CHAR-FACTORY: sprite pixels per world pixel. 2 = an HD sheet (224×192,
        frames 32×64, the same frame order, rows and world anchors); absent =
        1, the classic 112×96.
      type: integer
      enum: [1, 2]

    CharacterChoice:
      description: |
        A look. v1: a preset sheet (`preset`), or a built-in sheet (`palette`
        0-5) with `hueShift` degrees. v2 (`v: 2`, by `kind`): `humanoid`
        (`base` 0-5, `hue` 0-345 or `colors` per part, `acc` up to three),
        `mascot` (`species`, `color`, `expr`, `gear`), `custom` (`sheet`, a
        preset id). v3 (`v: 3`, CHAR-HUMAN): `person`, made of parts
        (`gender`, `parts` per slot, `colors` per slot); an unknown part id
        draws as the slot's built-in. A look with a v1 shape is always sent and
        stored in it.
      type: object
      additionalProperties: false
      properties:
        preset:
          type: string
        palette:
          type: integer
        hueShift:
          type: integer
        v:
          description: 2 for a v2 look, 3 for a person (absent in v1).
          type: integer
        kind:
          $ref: '#/components/schemas/CharacterKind'
        base:
          type: integer
        hue:
          type: integer
        colors:
          $ref: '#/components/schemas/CharacterColors'
        acc:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/CharacterAccessory'
        species:
          $ref: '#/components/schemas/MascotSpecies'
        color:
          type: string
        expr:
          description: |
            A mascot's face (smile, happy, focus, sleepy) or a person's
            expression (neutral, smile, wink, shy, surprised, sleepy, playful,
            happy); each kind takes only its own.
          $ref: '#/components/schemas/LookExpression'
        gear:
          $ref: '#/components/schemas/MascotGear'
        sheet:
          type: string
        gender:
          $ref: '#/components/schemas/CharacterGender'
        parts:
          $ref: '#/components/schemas/CharacterWorn'
        body:
          $ref: '#/components/schemas/CharacterBody'

    LookExpression:
      type: string
      enum: [smile, happy, focus, sleepy, neutral, wink, shy, surprised, playful]

    CharacterBody:
      description: |
        A person's body variant, independent of gender: its own silhouette,
        never a stretched one.
      type: string
      enum: [standard, slim, curvy, plus]

    CharacterGender:
      type: string
      enum: [m, f]

    CharacterParts:
      description: |
        CHAR-HUMAN: the owner's imported parts (~/.config/cld-gui/parts/)
        and the named person looks saved from the looks window, re-sent in
        full whenever one is saved or removed. The built-in parts ship with
        the page.
      type: object
      additionalProperties: false
      required: [type, parts, presets, packs]
      properties:
        type:
          const: characterParts
        packs:
          type: array
          items:
            $ref: '#/components/schemas/CharacterPack'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/CharacterPart'
        presets:
          type: array
          items:
            $ref: '#/components/schemas/PersonPreset'

    PersonPreset:
      type: object
      additionalProperties: false
      required: [name, look]
      properties:
        name:
          type: string
        look:
          $ref: '#/components/schemas/CharacterChoice'

    CharacterPart:
      description: |
        One part: `sheet` = 112×96 on the body grid (21 frames), `head` = the
        head canvas (front, back, side views side by side), placed on every
        frame at the head anchor. `pixels` has one character per pixel ('.'
        transparent, else an index into `palette` in
        0-9a-zA-Z); `ramp` is the palette colours a picked colour replaces.
      type: object
      additionalProperties: false
      required: [id, slot, kind, ramp, palette, pixels]
      properties:
        id:
          type: string
        slot:
          $ref: '#/components/schemas/CharacterPartSlot'
        kind:
          type: string
          enum: [sheet, head]
        gender:
          $ref: '#/components/schemas/CharacterGender'
        name:
          type: string
        ramp:
          type: array
          items:
            type: string
        palette:
          type: array
          items:
            type: string
        pixels:
          type: string
        hd:
          $ref: '#/components/schemas/CharacterPartHd'
        expressions:
          description: A face's expressions other than neutral (its own art).
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CharacterPartArt'
        bodies:
          description: The bodies the part's own art fits (absent = standard).
          type: array
          items:
            $ref: '#/components/schemas/CharacterBody'
        variants:
          description: The part drawn for other bodies, by body.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CharacterPartArt'
        pack:
          description: The pack it came from (its id is `<pack>/<part>`).
          type: string
        label:
          $ref: '#/components/schemas/LocalText'

    CharacterPartHd:
      description: |
        CHAR-FACTORY: the part at more detail (density 2: 224×192 for a
        sheet, 96×48 for a head canvas; HD64-SAMPLE density 4: 448×384 and
        192×96), same encoding; `pixels` and `palette` above are its classic
        copy (derived 2×2, or drawn on its own for density 4), for what cannot
        draw the detail.
      type: object
      additionalProperties: false
      required: [ramp, palette, pixels]
      properties:
        density:
          $ref: '#/components/schemas/CharacterPartDensity'
        ramp:
          type: array
          items:
            type: string
        palette:
          type: array
          items:
            type: string
        pixels:
          type: string

    CharacterPartDensity:
      description: Pixels per classic pixel of a part's detailed art (absent = 2).
      type: integer
      enum: [2, 4]

    CharacterPartSlot:
      type: string
      enum: [back, body, face, legwear, bottom, shoes, top, fullbody, outer, neck, wrist, hair, acc]

    CharacterPartArt:
      description: |
        One more drawing of a part (an expression of a face, the part for
        another body), the same size and encoding as the part's own.
      type: object
      additionalProperties: false
      required: [palette, pixels]
      properties:
        palette:
          type: array
          items:
            type: string
        pixels:
          type: string
        ramp:
          type: array
          items:
            type: string
        hd:
          $ref: '#/components/schemas/CharacterPartHd'

    CharacterPack:
      description: |
        CHAR-FACTORY: a content pack (cld/packs/<id>/ built in,
        ~/.config/cld-gui/packs/<id>/ the user's), always on.
      type: object
      additionalProperties: false
      required: [id, version, title, builtIn, characters, presets]
      properties:
        id:
          type: string
        version:
          type: integer
        title:
          $ref: '#/components/schemas/LocalText'
        builtIn:
          type: boolean
        characters:
          type: array
          items:
            $ref: '#/components/schemas/PackCharacter'
        presets:
          type: array
          items:
            $ref: '#/components/schemas/PackPreset'

    LocalText:
      type: object
      additionalProperties: false
      required: [ko, en]
      properties:
        ko:
          type: string
        en:
          type: string

    PackCharacter:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
        name:
          $ref: '#/components/schemas/LocalText'
        age:
          type: integer

    PackPreset:
      type: object
      additionalProperties: false
      required: [id, name, look]
      properties:
        id:
          type: string
        character:
          type: string
        outfit:
          type: string
        name:
          $ref: '#/components/schemas/LocalText'
        look:
          $ref: '#/components/schemas/CharacterChoice'

    CharacterWorn:
      description: |
        A person's part id per slot (built-in or the owner's, see
        `characterParts`); `acc` up to three. A missing required slot (body,
        face, top, bottom) is its built-in.
      type: object
      additionalProperties: false
      properties:
        back:
          type: string
        body:
          type: string
        face:
          type: string
        legwear:
          type: string
        bottom:
          type: string
        shoes:
          type: string
        top:
          type: string
        fullbody:
          type: string
        outer:
          type: string
        neck:
          type: string
        wrist:
          type: string
        hair:
          type: string
        acc:
          type: array
          maxItems: 3
          items:
            type: string

    CharacterRefused:
      description: |
        A `setCharacter` the daemon did not apply, to its sender only:
        `unknown` (no character by that name), `invalid` (not a look, or a
        preset that is not in the folder), `full` (characters.json is at its
        500 characters / 64 KB and holds no automatic look it may drop for it).
      type: object
      additionalProperties: false
      required: [type, key, reason]
      properties:
        type:
          const: characterRefused
        key:
          type: string
        reason:
          $ref: '#/components/schemas/CharacterRefusalReason'

    CharacterRefusalReason:
      type: string
      enum: [unknown, invalid, full]

    CharacterKind:
      type: string
      enum: [humanoid, mascot, custom, person]

    CharacterColors:
      description: |
        A humanoid's or person's part colours (`#rrggbb`); a missing part keeps
        its own. `outer` and `acc` are a person's only.
      type: object
      additionalProperties: false
      properties:
        hair:
          type: string
        skin:
          type: string
        top:
          type: string
        bottom:
          type: string
        shoes:
          type: string
        outer:
          type: string
        acc:
          type: string
        legwear:
          type: string
        fullbody:
          type: string
        neck:
          type: string
        wrist:
          type: string
        back:
          type: string

    CharacterAccessory:
      type: string
      enum: [glasses, headset, cap]

    MascotSpecies:
      type: string
      enum: [coral, byte, puff, tori]

    MascotExpression:
      type: string
      enum: [smile, happy, focus, sleepy]

    MascotGear:
      type: string
      enum: [headset, beanie, sprout, crown]

    SetCharacter:
      description: |
        Choose the look of the character named `key`; null goes back to the
        automatic one. Cosmetic: any logged-in client may, also on a
        read-only daemon. Answered by `characterPresets` to every client; an
        unknown key or preset changes nothing.
      type: object
      additionalProperties: false
      required: [type, key, character]
      properties:
        type:
          const: setCharacter
        key:
          type: string
        character:
          oneOf:
            - $ref: '#/components/schemas/CharacterChoice'
            - type: 'null'

    # ── cld-gui: new-device approval (T-0022) ────────────────────
    # Only when the daemon runs with --allow-approval-requests (off by
    # default). The answer is an HTTP call (POST /api/auth/approvals/:id with
    # the code the approver typed), so there is no client message.

    DeviceApprovalRequest:
      description: |
        A device without a session asks to be let in. To every logged-in
        client; also listed by GET /api/auth/approvals. Approving needs the
        6-digit code shown on the new device, which this message never
        carries. `ip` and `network` (`funnel` = from the internet through
        Tailscale Funnel, `tailnet`, `lan`, `local` = this PC or an SSH
        tunnel) say where it came from; `agent` is its browser and OS; times
        are epoch milliseconds.
      type: object
      additionalProperties: false
      required: [type, id, label, agent, ip, network, createdAt, expiresAt]
      properties:
        type:
          const: deviceApprovalRequest
        id:
          type: string
        label:
          type: string
        agent:
          type: string
        ip:
          type: string
        network:
          $ref: '#/components/schemas/ApprovalNetwork'
        createdAt:
          type: number
        expiresAt:
          type: number

    ApprovalNetwork:
      type: string
      enum: [funnel, tailnet, lan, local]

    DeviceApprovalClosed:
      description: A request was approved, refused or expired; clients drop its dialog.
      type: object
      additionalProperties: false
      required: [type, id, outcome]
      properties:
        type:
          const: deviceApprovalClosed
        id:
          type: string
        outcome:
          $ref: '#/components/schemas/ApprovalOutcome'

    ApprovalOutcome:
      type: string
      enum: [approved, refused, expired]

    # ── cld-gui: persistent device login (T-0034) ────────────────

    NewDeviceLogin:
      description: |
        A device the server had not seen logged in: its web app registered a
        new device key, or a login by code, passkey, approval or Tailscale
        was still no known device 30 s later. To every logged-in client; the
        device itself skips it by `id`, its row in the device list (GET
        /api/auth/sessions). A known device logging back in sends nothing.
        `at` is epoch milliseconds.
      type: object
      additionalProperties: false
      required: [type, id, label, at]
      properties:
        type:
          const: newDeviceLogin
        id:
          type: string
        label:
          type: string
        at:
          type: number

    # ── cld-gui: trusted-device terminal (T-0052) ────────────────

    ShellNotice:
      description: |
        A trusted device opened or closed a login shell (--allow-terminal).
        To every logged-in client; the device itself skips it by `deviceId`,
        its row in the device list. `id` is the shell's id (GET /api/shell),
        `label` the device's name, `at` epoch milliseconds. Never any input
        or output of the shell.
      type: object
      additionalProperties: false
      required: [type, action, id, deviceId, label, at]
      properties:
        type:
          const: shellNotice
        action:
          $ref: '#/components/schemas/ShellAction'
        id:
          type: string
        deviceId:
          type: string
        label:
          type: string
        at:
          type: number

    ShellAction:
      type: string
      enum: [open, close]
    # ── cld-gui: repositories and worktrees (T-0020, FR-ENG-003/005) ──
    # One project's git repository, addressed by the project's NAME (an
    # engine project), never by a path. Reading
    # (`repoView`, `repoDiffRequest`) is for logged-in clients; the writes
    # (`repoAction`) also need the daemon to run with --allow-actions.

    RepoView:
      description: |
        The client opened (on=true) or closed a project's repository panel.
        While anyone has it open the server sends `repoState` for that project
        at once and again on every change, polling `git status` every 10 s;
        with nobody looking no git runs.
      type: object
      additionalProperties: false
      required: [type, project, on]
      properties:
        type:
          const: repoView
        project:
          type: string
        on:
          type: boolean

    RepoState:
      description: |
        One project's repository: `git status --porcelain=v2 --branch`, the
        `git diff --stat` of the unstaged and of the staged changes, and the
        project's active task worktrees. `ok` false means there is nothing to
        show (not a git repository, folder or git missing, not the repository's
        top folder) and `error` says why in Korean. `files` is cut at 300
        entries (`filesTruncated`). `ahead`/`behind` are null without an
        upstream; `branch` is null on a detached HEAD; `head` is the short
        commit id, null before the first commit.
      type: object
      additionalProperties: false
      required: [type, project, ok]
      properties:
        type:
          const: repoState
        project:
          type: string
        ok:
          type: boolean
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        branch:
          type: [string, 'null']
        head:
          type: [string, 'null']
        upstream:
          type: [string, 'null']
        ahead:
          type: [integer, 'null']
        behind:
          type: [integer, 'null']
        files:
          type: array
          items:
            $ref: '#/components/schemas/RepoFile'
        filesTruncated:
          type: boolean
        statUnstaged:
          type: string
        statStaged:
          type: string
        worktrees:
          type: array
          items:
            $ref: '#/components/schemas/RepoWorktree'
        merges:
          description: |
            W4: the project's merge history, newest first, at most 20 (the
            daemon keeps 50 per project in `merge-history.json`, so it survives
            a restart).
          type: array
          items:
            $ref: '#/components/schemas/RepoMerge'

    RepoFile:
      description: |
        One `git status` entry. `index` and `worktree` are porcelain's X and Y
        letters (`M` `A` `D` `R` `C` `T` `U`, `.` = unchanged); an untracked
        entry is `.` and `?` (a new folder ends with `/`). `origPath` is the old
        name of a rename or copy.
      type: object
      additionalProperties: false
      required: [path, index, worktree]
      properties:
        path:
          type: string
        origPath:
          type: string
        index:
          type: string
        worktree:
          type: string

    RepoWorktree:
      description: |
        A task worktree the daemon created (`<folder>/.worktrees/<task>` on
        branch `task/<task>`). `ahead`/`behind` count commits against `base`
        (the branch it started from); `merged` is true when the branch has no
        commit `base` lacks; `dirty` counts uncommitted entries; `exists` is
        false when the folder is gone. W2: `taskId` is the Task it was made
        for, `assignmentId` the agent it is given to (`assignee`: that agent's
        name now), `createdBy` who made it (`user`, `cli`, `agent:<name>`);
        all absent on worktrees made before W2. W3: `merge` is the last merge
        of its branch into `base` (a click or the automatic one when its Task
        was done); W4: kept across restarts.
      type: object
      additionalProperties: false
      required: [task, path, branch, base, created, exists, ahead, behind, dirty, merged]
      properties:
        task:
          type: string
        taskId:
          type: string
        assignmentId:
          type: string
        assignee:
          type: string
        createdBy:
          type: string
        path:
          type: string
        branch:
          type: string
        base:
          type: string
        created:
          type: string
        exists:
          type: boolean
        ahead:
          type: integer
        behind:
          type: integer
        dirty:
          type: integer
        merged:
          type: boolean
        merge:
          $ref: '#/components/schemas/RepoMerge'

    RepoMerge:
      description: |
        W3: one merge of a task worktree's branch into its base. `auto`: the
        daemon's own (its Task was done), refused for a protected base
        (`code: protected`). `kind`: ff, a merge commit, or nothing to do;
        `sha` the base's commit after. On a conflict nothing changed and
        `conflicts` lists the files; `error` is the Korean reason. W4: `task`
        and `branch` say which worktree it was (the history outlives it).
      type: object
      additionalProperties: false
      required: [ok, at, target, auto]
      properties:
        task:
          type: string
        branch:
          type: string
        ok:
          type: boolean
        at:
          type: string
        target:
          type: string
        auto:
          type: boolean
        kind:
          description: ff, merge or already.
          type: string
        sha:
          type: string
        code:
          type: string
        conflicts:
          type: array
          items:
            type: string
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    RepoDiffRequest:
      description: |
        Ask for the unified diff of one file in the project's latest `git
        status` (`staged`: the index against HEAD, otherwise the work tree
        against the index; a new file is shown whole). A path that is not in
        that list is refused. The answer is `repoDiff` to the sender only.
        `offset` is the `nextOffset` of the answer before, to get the next
        200 KB. W4: with `task` (a task worktree), the file is one of that
        worktree's changed files (`repoWorktreeDetail`) and the diff is the
        worktree against the commit its branch left its base at; `staged`
        is then false.
      type: object
      additionalProperties: false
      required: [type, requestId, project, path, staged]
      properties:
        type:
          const: repoDiffRequest
        requestId:
          type: string
        project:
          type: string
        task:
          type: string
        path:
          type: string
        staged:
          type: boolean
        offset:
          type: integer

    RepoDiff:
      description: |
        Answer to one `repoDiffRequest`: at most 200 KB of the diff from
        `offset`, cut at a line end. `nextOffset` is present when more
        follows; `limited` is true when the diff goes on beyond what the
        daemon will page through (2 MB).
      type: object
      additionalProperties: false
      required: [type, requestId, project, path, staged, ok]
      properties:
        type:
          const: repoDiff
        requestId:
          type: string
        project:
          type: string
        task:
          type: string
        path:
          type: string
        staged:
          type: boolean
        ok:
          type: boolean
        text:
          type: string
        nextOffset:
          type: integer
        limited:
          type: boolean
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    RepoWorktreeRequest:
      description: |
        W4: ask for what one task worktree changed: its changed files and its
        recent commits. Answered with `repoWorktreeDetail` to the sender only.
      type: object
      additionalProperties: false
      required: [type, requestId, project, task]
      properties:
        type:
          const: repoWorktreeRequest
        requestId:
          type: string
        project:
          type: string
        task:
          type: string

    RepoChangedFile:
      description: |
        W4: one file a task worktree changed against the commit its branch left
        its base at (committed and uncommitted together). `status`: `M` `A`
        `D` `R` `C` `T`, or `?` for a file git does not track yet.
      type: object
      additionalProperties: false
      required: [path, status]
      properties:
        path:
          type: string
        origPath:
          type: string
        status:
          type: string

    RepoCommit:
      type: object
      additionalProperties: false
      required: [sha, subject, author, at]
      properties:
        sha:
          type: string
        subject:
          type: string
        author:
          type: string
        at:
          type: string

    RepoWorktreeDetail:
      description: |
        W4: answer to one `repoWorktreeRequest`. `files` (at most 300,
        `filesTruncated`) are the worktree's changes against where its branch
        left its base; `commits` its commits `base` lacks, newest first, at
        most 20. `guard` says in Korean what the protected-branch guard hook
        did for this repository (installed, or why not).
      type: object
      additionalProperties: false
      required: [type, requestId, project, task, ok]
      properties:
        type:
          const: repoWorktreeDetail
        requestId:
          type: string
        project:
          type: string
        task:
          type: string
        ok:
          type: boolean
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        files:
          type: array
          items:
            $ref: '#/components/schemas/RepoChangedFile'
        filesTruncated:
          type: boolean
        commits:
          type: array
          items:
            $ref: '#/components/schemas/RepoCommit'
        guard:
          type: string

    RepoActionKind:
      description: |
        `stage` / `unstage`: `paths` (entries of the latest `git status`; none
        = all). `commit`: `message`, for what is staged. `push`: the current
        branch to its tracked upstream, never forced. `worktreeRemove`: the
        task worktree `task`, `force` only after the user confirmed losing
        uncommitted or unmerged work. `worktreeNew` (W2): Task `taskId`'s
        worktree, branch `task/<taskId>-<slug>` from the project's main branch
        (or `base`), given to the agent `assignee` (a name) when there is one.
        `merge` (W3): the task worktree `task`'s branch into its base, queued
        per repository; fast-forward, else a merge commit; a conflict changes
        nothing. A protected base (main, master, a remote's default, the
        owner's list) needs a fresh step-up from a remote device (`error:
        stepup`).
      type: string
      enum: [stage, unstage, commit, push, worktreeRemove, worktreeNew, merge]

    RepoAction:
      description: |
        Run one git write in a project's repository. Refused, without running
        git, unless the daemon runs with --allow-actions, the client is
        privileged, `project` is a known project, no other action for the same
        folder is still running, and the arguments hold (see
        `RepoActionKind`). Never force-pushes and never touches another remote
        or the git config. Answered with `repoActionResult` to the sender only
        and with a fresh `repoState` to everyone viewing the project.
      type: object
      additionalProperties: false
      required: [type, requestId, action, project]
      properties:
        type:
          const: repoAction
        requestId:
          type: string
        action:
          $ref: '#/components/schemas/RepoActionKind'
        project:
          type: string
        paths:
          type: array
          items:
            type: string
        message:
          type: string
        task:
          type: string
        force:
          type: boolean
        taskId:
          type: string
        assignee:
          type: string
        base:
          type: string

    RepoActionResult:
      description: |
        Answer to one `repoAction`. `detail` is a short Korean note (the new
        commit id, what was pushed, whether the branch was kept); `error` is
        the daemon's refusal or git's reason in Korean; `needsForce` is true
        when a worktree removal was refused only because it would lose
        uncommitted or unmerged work.
      type: object
      additionalProperties: false
      required: [type, requestId, action, project, ok]
      properties:
        type:
          const: repoActionResult
        requestId:
          type: string
        action:
          $ref: '#/components/schemas/RepoActionKind'
        project:
          type: string
        ok:
          type: boolean
        detail:
          type: string
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        needsForce:
          type: boolean

    # ── cld-gui: the office's data ───────────────────────────────
    # Contract for the cld-gui fork (cld/docs/design/protocol.md, IR-UI-001).
    OfficeSnapshot:
      description: |
        Whole office snapshot, re-sent in full on every change.
        `readOnly` is true unless the daemon runs with --allow-actions
        (NFR-SEC-012); with it false, the engine's project, job and
        repository actions are enabled.
        `chat` is true when it runs with --allow-chat: a background session's
        character offers its terminal (`claude attach`, `/cld/attach/:id`).
        Every row of `orchestrators` is bound to exactly one character:
        `agentId` is that pixel-agents agent id.
      type: object
      additionalProperties: false
      required: [type, readOnly, tabs, orchestrators]
      properties:
        type:
          const: officeSnapshot
        readOnly:
          type: boolean
        chat:
          type: boolean
        tabs:
          type: array
          items:
            $ref: '#/components/schemas/OfficeRoom'
        orchestrators:
          type: array
          items:
            $ref: '#/components/schemas/OfficeOrchestrator'

    OfficeRoom:
      type: object
      additionalProperties: false
      required: [name, kind, order]
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/OfficeRoomKind'
        order:
          type: integer

    OfficeRoomKind:
      description: A room of the office; `ops` is the 관리실.
      type: string
      enum: [orch, ops]

    SessionProcessState:
      description: Whether the row's Claude session is alive (`off` means it is not).
      type: string
      enum: [running, off]

    CodexTaskState:
      type: string
      enum: [running, limit, done, failed, stopped, unknown]

    HwDisk:
      type: object
      additionalProperties: false
      required: [name, freeGib]
      properties:
        name:
          type: string
        freeGib:
          type: [number, 'null']
        warnGib:
          type: [number, 'null']
        totalGib:
          description: The disk's size (T-0046), when the source knows it (the daemon's own sampler).
          type: [number, 'null']
        warning:
          type: boolean
        view:
          description: On WSL, which side of the machine the disk belongs to (`wsl` = the distro's root, `windows` = a drive under /mnt). Absent elsewhere, where there is only one view.
          $ref: '#/components/schemas/HwDiskView'

    HwDiskView:
      type: string
      enum: [wsl, windows]

    HwGpu:
      description: One GPU as LibreHardwareMonitor lists it. A reading it does not have is absent. `util` is a fraction from 0 to 1.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        tempC:
          type: [number, 'null']
        hotspotC:
          type: [number, 'null']
        powerW:
          type: [number, 'null']
        util:
          type: [number, 'null']
        vramUsedMib:
          type: [number, 'null']
        vramTotalMib:
          type: [number, 'null']

    HwCpuCore:
      description: One CPU core (LibreHardwareMonitor, by sensor name) or, without it, one logical CPU of the OS. A reading it does not have is absent. `util` is a fraction from 0 to 1.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: The core as the source names it (`P-Core #1`, `E-Core #3`, `Core #2`, `CPU #5`).
          type: string
        clockMhz:
          type: [number, 'null']
        tempC:
          type: [number, 'null']
        util:
          type: [number, 'null']

    HwRamDetail:
      description: The OS's own memory (on WSL the distro's, from /proc/meminfo).
      type: object
      additionalProperties: false
      required: [usedGib, availableGib]
      properties:
        usedGib:
          type: number
        cachedGib:
          description: Buffers plus page cache.
          type: [number, 'null']
        availableGib:
          type: number
        swapUsedGib:
          type: [number, 'null']
        swapTotalGib:
          type: [number, 'null']

    HwHostRamDetail:
      description: Windows' memory as LibreHardwareMonitor lists it. `virtual*` is Windows' virtual memory (commit), not GPU memory. `util` is a fraction from 0 to 1.
      type: object
      additionalProperties: false
      required: [usedGib, availableGib]
      properties:
        usedGib:
          type: number
        availableGib:
          type: number
        util:
          type: [number, 'null']
        virtualUsedGib:
          type: [number, 'null']
        virtualTotalGib:
          type: [number, 'null']

    GitCommit:
      type: object
      additionalProperties: false
      required: [hash, subject]
      properties:
        hash:
          type: string
        subject:
          type: string
        time:
          type: [string, 'null']

    RemoteControlState:
      type: object
      additionalProperties: false
      required: [on, url]
      properties:
        on:
          type: boolean
        url:
          type: [string, 'null']

    BackgroundSession:
      description: The conversation runs as a Claude background session (`claude agents`).
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id:
          type: string
        state:
          type: string
        sessionId:
          type: [string, 'null']
        started:
          type: [string, 'null']

    OfficeOrchestrator:
      type: object
      additionalProperties: false
      required: [name, dir, tab, order, state, busy, compactions, alive, remoteControl, agentId]
      properties:
        name:
          type: string
        dir:
          type: string
        title:
          type: [string, 'null']
        tab:
          type: string
        order:
          type: integer
        state:
          $ref: '#/components/schemas/SessionProcessState'
        busy:
          type: [boolean, 'null']
        pid:
          type: [integer, 'null']
        sessionId:
          type: [string, 'null']
        bg:
          oneOf:
            - $ref: '#/components/schemas/BackgroundSession'
            - type: 'null'
        remoteControl:
          $ref: '#/components/schemas/RemoteControlState'
        compactions:
          type: integer
        alive:
          type: boolean
        agentId:
          type: [integer, 'null']
        provider:
          description: |
            Who manages this row (T-0032): `engine` a project of the built-in
            engine, `claude` any other Claude Code session. Its 설정 and 삭제
            go to that provider.
          $ref: '#/components/schemas/OrchestratorProvider'
        level:
          description: Lv, XP and 환생 of this row's character (U-15); absent for a row with no stable identity.
          $ref: '#/components/schemas/OfficeLevel'
        renewing:
          description: |
            RENEW-STUCK: an engine project whose `cld-gui renew` is pending (waiting for its
            turn to end, or starting the new conversation). Its messages wait for the new
            conversation, and its character stays at work. Absent when none is.
          type: boolean
        heldEdits:
          description: |
            MSG-HOLD2: how many of the boss's queued messages to this engine project are held
            for editing (not delivered until a page decides). Absent when none is.
          type: integer
          minimum: 1

    OfficeLevel:
      description: |
        A character's level, from the work the office actually observed (completed
        turns, tool uses, finished jobs and Codex tasks). `floor` and `next` are the
        XP at which `level` and `level + 1` start; `rebirths` counts the renews
        (교대) that really started a new conversation.
      type: object
      additionalProperties: false
      required: [level, xp, floor, next, rebirths]
      properties:
        level:
          type: integer
        xp:
          type: integer
        floor:
          type: integer
        next:
          type: integer
        rebirths:
          type: integer

    OrchestratorProvider:
      type: string
      enum: [engine, claude]

    TempStaff:
      description: >-
        TEMP-PLATES — the per-project staff roster's employees and the execution each was
        last bound to (open, or released within the last hour). An execution is one real
        run: `claude:<spawn tool_use id>` (a sub-agent) or `codex:<task id>` (a Codex
        temporary). An employee is a game character reused across executions; every
        execution is a fresh AI session. Sent on every change.
      type: object
      additionalProperties: false
      required: [type, staff]
      properties:
        type:
          const: tempStaff
        staff:
          type: array
          items:
            $ref: '#/components/schemas/TempEmployee'

    TempEmployee:
      type: object
      additionalProperties: false
      required: [execution, employeeId, nameId, project, working]
      properties:
        execution:
          type: string
        employeeId:
          type: string
        nameId:
          type: string
          description: The roster name's id (core/src/cld/staffNames.ts); the UI language picks its form.
        project:
          type: string
        working:
          type: boolean
          description: The execution is still bound (not ended).
        level:
          $ref: '#/components/schemas/OfficeLevel'
        contextTokens:
          type: integer
          description: The sub-agent's own transcript context (the main agents' snapshot rule); absent when unverified (Codex, or no transcript watched).
        maxContextTokens:
          type: integer

    CodexTasks:
      description: Codex delegations from the engine's `cld-gui codex` (T-0021). Each running or limit-waiting task is a contractor character (`agentId`).
      type: object
      additionalProperties: false
      required: [type, tasks]
      properties:
        type:
          const: codexTasks
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/CodexTask'

    CodexTask:
      type: object
      additionalProperties: false
      required: [id, project, state]
      properties:
        id:
          type: string
        project:
          type: string
        model:
          type: [string, 'null']
        state:
          $ref: '#/components/schemas/CodexTaskState'
        pid:
          type: [integer, 'null']
        branch:
          type: [string, 'null']
        created:
          type: [string, 'null']
          description: When the task was asked for (U-03).
        started:
          type: [string, 'null']
          description: When its worker started Codex; null while the task is queued (U-03).
        ended:
          type: [string, 'null']
        exit:
          type: [integer, 'null']
        resetAt:
          type: [string, 'null']
        progressDone:
          type: [integer, 'null']
        progressTotal:
          type: [integer, 'null']
        commits:
          type: [integer, 'null']
        agentId:
          type: [integer, 'null']
        spec:
          type: [string, 'null']
          description: >-
            The task's spec file name (its base name only, never a path), the
            office's one-line task for the Codex worker (T-0041).
        title:
          type: [string, 'null']
          description: First Markdown heading in the spec, or its file name.
        provider:
          $ref: '#/components/schemas/OrchestratorProvider'
          description: Who runs the task (T-0021).
        agent:
          type: string
          description: D5 — the Codex Worker whose message this run carries; absent for a `cld-gui codex` run.
        task:
          type: string
          description: D5 — the Task a Worker's run is an Execution of.

    OfficeJobs:
      description: The engine's background jobs (`cld-gui job`, T-0019), with progress parsed server-side from the last `\r` segment of the log (tqdm). Sent whenever the engine runs (an empty list included).
      type: object
      additionalProperties: false
      required: [type, jobs]
      properties:
        type:
          const: officeJobs
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/OfficeJob'

    OfficeJob:
      description: |
        `id` is set for the engine's jobs only (T-0019): the job panel can read
        their logs and stop them with `jobAction`. `created` is when the job was
        asked for; `started` is when it really began running (U-03): null while
        a GPU job waits for its reservation (`gpu: queued`), the lease time once
        it holds one. A job without a GPU starts when it is created. `project` is null for an
        engine job started outside every project folder. `label` (T-0047) is a
        short name that is never the command: the log file name without its
        timestamp prefix.
      type: object
      additionalProperties: false
      required: [pid, project, cmd]
      properties:
        id:
          type: [string, 'null']
        label:
          type: [string, 'null']
        pid:
          type: integer
        project:
          type: [string, 'null']
        cmd:
          type: string
        tab:
          type: [string, 'null']
        created:
          type: [string, 'null']
        started:
          type: [string, 'null']
        ended:
          type: [string, 'null']
        exit:
          type: [integer, 'null']
        progress:
          oneOf:
            - $ref: '#/components/schemas/JobProgress'
            - type: 'null'
        gpu:
          description: A GPU job's reservation (T-0021, HIF §3); absent or null for others.
          oneOf:
            - $ref: '#/components/schemas/GpuJobState'
            - type: 'null'
        gpuId:
          type: [string, 'null']
        stopped:
          type: boolean
          description: The user explicitly stopped the engine job.

    GpuJobState:
      type: string
      enum: [queued, leased, done]

    JobProgress:
      type: object
      additionalProperties: false
      required: [pct]
      properties:
        label:
          type: [string, 'null']
        pct:
          type: number
        rate:
          type: [string, 'null']
        eta:
          type: [string, 'null']
        indeterminate:
          type: boolean

    HwReadingSource:
      description: Where a reading came from. `lhm` = LibreHardwareMonitor's `data.json` (Windows, WSL); `sysfs` = Linux `/sys/class/hwmon` and the GPU's DRM device; `nvidia-smi` = opt-in NVIDIA query; `os` = the daemon's own CPU, memory and disk counters.
      type: string
      enum: [lhm, sysfs, nvidia-smi, os]

    HwSample:
      description: Latest HW sample from the daemon's own sampler. Numbers are null or absent when not collected (no sensor tool, GPU skipped). `stale` is true when `ts` is older than 30 s. Utilizations (`cpuUtil`, `gpuUtil`) are fractions from 0 to 1.
      type: object
      additionalProperties: false
      required: [type, stale, disks, warnings]
      properties:
        type:
          const: hwSample
        ts:
          type: [string, 'null']
        stale:
          type: boolean
        cpuTempC:
          type: [number, 'null']
        cpuPowerW:
          type: [number, 'null']
        cpuUtil:
          type: [number, 'null']
        gpuTempC:
          type: [number, 'null']
        gpuHotspotC:
          type: [number, 'null']
        gpuPowerW:
          type: [number, 'null']
        gpuUtil:
          type: [number, 'null']
        vramUsedMib:
          type: [number, 'null']
        vramTotalMib:
          type: [number, 'null']
        cpuCores:
          description: Every core with its clock, temperature and load. From LibreHardwareMonitor when it answers (matched by sensor type and name), else the OS's logical CPUs (clock and load only).
          type: array
          items:
            $ref: '#/components/schemas/HwCpuCore'
        cpuCoresW:
          description: Power drawn by the cores alone (LHM `CPU Cores`; the package is `cpuPowerW`).
          type: [number, 'null']
        cpuCoreMaxC:
          type: [number, 'null']
        cpuCoreAvgC:
          type: [number, 'null']
        cpuBusMhz:
          type: [number, 'null']
        ramDetail:
          $ref: '#/components/schemas/HwRamDetail'
        hostRamDetail:
          $ref: '#/components/schemas/HwHostRamDetail'
        gpus:
          description: Every GPU the sensor source lists (LHM), a discrete card first; the first one also fills the single-GPU fields above, which older clients and `cld-gui hw` read.
          type: array
          items:
            $ref: '#/components/schemas/HwGpu'
        ramUsedGib:
          type: [number, 'null']
        ramTotalGib:
          type: [number, 'null']
        hostRamUsedGib:
          type: [number, 'null']
        hostRamTotalGib:
          type: [number, 'null']
        topProcesses:
          description: '`cld-gui hw` only (on demand): the top 5 processes by CPU, command lines masked.'
          type: array
          items:
            $ref: '#/components/schemas/HwTopProcess'
        gpuProcesses:
          description: Processes using the GPU (WSL /dev/dxg openers, else nvidia-smi's compute apps); null when nothing could list them (LHM only).
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/GpuProcess'
        swapUsedGib:
          type: [number, 'null']
        lhm:
          type: [boolean, 'null']
        disks:
          type: array
          items:
            $ref: '#/components/schemas/HwDisk'
        warnings:
          type: array
          items:
            type: string
        sources:
          type: object
          description: Source of each reading present in this sample, by field name (e.g. `cpuTempC` -> `lhm`, `disks` -> `os`).
          additionalProperties:
            $ref: '#/components/schemas/HwReadingSource'
        sensorsHint:
          description: True when temperatures are missing and the installer's `--hw-sensors` step can add them.
          type: [boolean, 'null']

    UsageWindow:
      type: object
      additionalProperties: false
      properties:
        fiveHourPct:
          type: [number, 'null']
        sevenDayPct:
          type: [number, 'null']
        fiveHourReset:
          type: [string, 'null']
        fiveHourIsReset:
          description: The source's last reading has passed this window's known reset time; its old percentage is intentionally withheld until a fresh reading arrives.
          type: [boolean, 'null']
        sevenDayReset:
          type: [string, 'null']
        sevenDayIsReset:
          description: The source's last reading has passed this window's known reset time; its old percentage is intentionally withheld until a fresh reading arrives.
          type: [boolean, 'null']
        models:
          description: Claude only, optional. The per-model weekly windows (Fable today; Sonnet or Opus when the plan has them) read from claude-dashboard's raw cache (`data.seven_day_<family>`).
          type: array
          items:
            type: object
            additionalProperties: false
            required: [family, pct]
            properties:
              family:
                description: Lowercase model family, e.g. fable.
                type: string
              pct:
                type: number
              reset:
                type: [string, 'null']

    UsageState:
      description: Claude and Codex usage, read by the daemon while anyone views (Claude Code's own status-line rate_limits from engine sessions, Codex's own session logs, the optional claude-dashboard plugin). A null provider is unknown.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: usageState
        ts:
          type: [string, 'null']
        claude:
          oneOf:
            - $ref: '#/components/schemas/UsageWindow'
            - type: 'null'
        codex:
          oneOf:
            - $ref: '#/components/schemas/UsageWindow'
            - type: 'null'

    CodexUsageCheck:
      description: A privileged user explicitly asks the daemon to make one minimal Codex turn so its own session log refreshes. Never automatic.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: codexUsageCheck

    AgentRulesRequest:
      description: |
        The settings page's "Agent rules" (RULES-DEFAULT). Without `text` or `useBuiltInRules`: show. With
        `text`: save the user's global rules (~/.config/cld-gui/rules.md; empty text removes the file). With
        `useBuiltInRules`: change whether the shipped tool-use rules apply. Either change needs a privileged
        connection, and a remote one a fresh step-up. `language` is the UI language, remembered (privileged
        only) to pick the default rules. Answered to the sender by `agentRules`.
      type: object
      additionalProperties: false
      required: [type, language]
      properties:
        type:
          const: agentRulesRequest
        language:
          type: string
          enum: [ko, en]
        text:
          type: string
        useBuiltInRules:
          type: boolean

    AgentRules:
      description: |
        Point-to-point answer of `agentRulesRequest`: the shipped default rules in `language`, whether the host
        uses them, and the user's global rules (`text`, empty for a read-only client). `error`: read_only,
        stepup, too_long or write_failed.
      type: object
      additionalProperties: false
      required: [type, language, defaults, useBuiltInRules, text]
      properties:
        type:
          const: agentRules
        language:
          type: string
          enum: [ko, en]
        defaults:
          type: string
        useBuiltInRules:
          type: boolean
        text:
          type: string
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    NewAgentPermissionRequest:
      description: |
        O4: the permission mode NEW agents start with (a project, a Worker, an import made after the answer);
        existing agents are never changed. `mode` bypass: new Claude agents get the skip-permissions mode;
        ask: they keep Claude Code's own checks. Saving needs a privileged connection on a daemon that is not
        read-only, and a remote connection needs a fresh step-up to choose bypass (choosing ask never does).
        Answered to the sender by `newAgentPermission`; a saved choice is broadcast to every office.
      type: object
      additionalProperties: false
      required: [type, mode]
      properties:
        type:
          const: newAgentPermissionRequest
        mode:
          type: string
          enum: [ask, bypass]

    NewAgentPermission:
      description: |
        O4: the stored default permission mode for new agents. `mode` is empty until the owner has answered the
        first-run question. `error` (point-to-point answer of a refused request): read_only, stepup or write_failed.
      type: object
      additionalProperties: false
      required: [type, mode]
      properties:
        type:
          const: newAgentPermission
        mode:
          type: string
          enum: ['', ask, bypass]
        error:
          type: string

    CodexUsageCheckResult:
      description: Point-to-point result of `codexUsageCheck`; an error is one short user-facing reason.
      type: object
      additionalProperties: false
      required: [type, ok]
      properties:
        type:
          const: codexUsageCheckResult
        ok:
          type: boolean
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    GpuTicket:
      description: A GPU reservation from the engine's `gpu_*` events. `ts` is when it queued (queue) or got its lease (holders). `ticket` counts `gpu_queue` events in the order the daemon read them (a cosmetic number).
      type: object
      additionalProperties: false
      required: [id, project, exclusive, ts, ticket]
      properties:
        id:
          type: string
        project:
          type: string
        label:
          type: [string, 'null']
        vramGib:
          type: [number, 'null']
        exclusive:
          type: boolean
        ts:
          type: string
        ticket:
          type: integer

    GpuEndKind:
      type: string
      enum: [release, cancel]

    GpuEnd:
      description: A reservation that ended. `kind` is the event (`gpu_release`, `gpu_cancel`); `reason` is gpu_cancel's (`cancel`, `wait`, `stop`, `dead`) or `dead` on a release whose wrapper was killed.
      type: object
      additionalProperties: false
      required: [id, project, kind, ts]
      properties:
        id:
          type: string
        project:
          type: string
        label:
          type: [string, 'null']
        kind:
          $ref: '#/components/schemas/GpuEndKind'
        reason:
          type: [string, 'null']
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        exit:
          type: [number, 'null']
        ts:
          type: string

    GpuBoard:
      description: The GPU reservation board (T-0046), folded from the `gpu_queue`, `gpu_lease`, `gpu_release`, `gpu_cancel` and `gpu_move` events of the engine's `~/.config/cld-gui/events.jsonl` (T-0021). `queue` is in line order (`gpu_move` applied). `recent` holds the last few endings, newest last. Sent when the engine is on.
      type: object
      additionalProperties: false
      required: [type, holders, queue, recent]
      properties:
        type:
          const: gpuBoard
        holders:
          type: array
          items:
            $ref: '#/components/schemas/GpuTicket'
        queue:
          type: array
          items:
            $ref: '#/components/schemas/GpuTicket'
        recent:
          type: array
          items:
            $ref: '#/components/schemas/GpuEnd'
        unleased:
          description: GPU processes with no reservation wrapper among their ancestors (T-0064).
          type: array
          items:
            $ref: '#/components/schemas/GpuProcess'
        processesUnknown:
          description: True when the collector has no GPU process list, so `unleased` cannot be known.
          type: boolean

    HwTopProcess:
      type: object
      additionalProperties: false
      required: [pid, cpuPct, rssMib, command]
      properties:
        pid:
          type: integer
        cpuPct:
          description: Lifetime average, like `ps -o pcpu`.
          type: number
        rssMib:
          type: number
        command:
          description: The command line, masked (mask.ts).
          type: string

    GpuProcess:
      type: object
      additionalProperties: false
      required: [pid, usedMib]
      properties:
        pid:
          type: integer
        usedMib:
          description: VRAM in MiB; null when the source cannot tell (/dev/dxg).
          type: [number, 'null']
        cmd:
          description: The process name (comm), never its command line.
          type: string

    OfficeEvent:
      description: One line of the engine's `~/.config/cld-gui/events.jsonl` (T-0019), summarized for the feed. `kind` is the event type (send, turn_end, revive, codex_end, job_end, orch_renew, ...). Message bodies are not forwarded; only `summary`.
      type: object
      additionalProperties: false
      required: [type, ts, kind, summary]
      properties:
        type:
          const: officeEvent
        ts:
          type: string
        kind:
          type: string
        source:
          type: [string, 'null']
        name:
          type: [string, 'null']
        summary:
          type: string
        ref:
          description: |
            job_end and codex_end (T-0043): which one ended, so a notice can open
            it: the engine job's or Codex task's id (or `pid:<n>` for a job without
            one: the job card's key). Never a command or a path.
          type: [string, 'null']
        provider:
          description: usage_reset_early's source provider; clients must not infer it from summary text.
          type: [string, 'null']
          enum: [claude, codex, null]
        period:
          description: usage_reset_early's usage window.
          type: [string, 'null']
          enum: [fiveHour, sevenDay, null]

    GitSummary:
      type: object
      additionalProperties: false
      required: [recent]
      properties:
        branch:
          type: [string, 'null']
        dirty:
          type: [integer, 'null']
        recent:
          type: array
          items:
            $ref: '#/components/schemas/GitCommit'

    StatusOutput:
      description: Result of a local read-only project report for an open project panel (FR-MON-003, FR-BRD-002).
      type: object
      additionalProperties: false
      required: [type, name, isDefault, output, truncated]
      properties:
        type:
          const: statusOutput
        name:
          type: string
        cmd:
          type: [string, 'null']
        isDefault:
          type: boolean
        exit:
          type: [integer, 'null']
        output:
          type: string
        truncated:
          type: boolean
        git:
          oneOf:
            - $ref: '#/components/schemas/GitSummary'
            - type: 'null'

    StatusView:
      description: The client opened (on=true) or closed a project panel; while open the server polls its local read-only report every 10 s.
      type: object
      additionalProperties: false
      required: [type, name, on]
      properties:
        type:
          const: statusView
        name:
          type: string
        on:
          type: boolean

    GroupRoom:
      type: object
      additionalProperties: false
      required: [id, name, members]
      properties:
        id:
          type: string
        name:
          type: string
        members:
          type: array
          items:
            type: string
        preview:
          type: string
        lastAt:
          type: number
        updates:
          description: Post and reply item ids, oldest first, for per-device room unread counts.
          type: array
          items:
            type: string
        systemLines:
          description: C4 - false when the room's system lines (Task assigned, reported, conflict, merged) are off; absent = on.
          type: boolean

    GroupDelivery:
      type: string
      enum: [pending, delivered, held, off]

    GroupPostItem:
      type: object
      additionalProperties: false
      required: [id, at, text, targets, delivery, replies]
      properties:
        id:
          type: string
        at:
          type: number
        sender:
          type: string
        text:
          type: string
        targets:
          type: array
          items:
            type: string
        delivery:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GroupDelivery'
        replyTo:
          description: MSG-ACTIONS - the message this post answers (a post or a member's reply).
          $ref: '#/components/schemas/ChatReply'
        system:
          description: C4 - a one-line system event (Task assigned, reported, conflict, merged), delivered to nobody.
          type: boolean
        replies:
          description: Replies from the turn each tagged member's room post started. Present only while a room is open.
          type: array
          items:
            $ref: '#/components/schemas/GroupReply'

    GroupReply:
      type: object
      additionalProperties: false
      required: [member, items]
      properties:
        member:
          type: string
        messageId:
          description: C2 - the id of this member's delivery of the post (the post's own id is the post's `id`). Absent for posts made before C2, whose replies are found by the header text.
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatItem'

    GroupRooms:
      type: object
      additionalProperties: false
      required: [type, rooms]
      properties:
        type:
          const: groupRooms
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/GroupRoom'

    GroupTimeline:
      type: object
      additionalProperties: false
      required: [type, room, posts]
      properties:
        type:
          const: groupTimeline
        room:
          $ref: '#/components/schemas/GroupRoom'
        posts:
          type: array
          items:
            $ref: '#/components/schemas/GroupPostItem'

    GroupActionResult:
      type: object
      additionalProperties: false
      required: [type, requestId, ok]
      properties:
        type:
          const: groupActionResult
        requestId:
          type: string
        ok:
          type: boolean
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    GroupView:
      type: object
      additionalProperties: false
      required: [type, room, on]
      properties:
        type:
          const: groupView
        room:
          type: string
        on:
          type: boolean

    GroupPost:
      type: object
      additionalProperties: false
      required: [type, requestId, room, text]
      properties:
        type:
          const: groupPost
        requestId:
          type: string
        room:
          type: string
        text:
          type: string
        replyTo:
          description: MSG-ACTIONS - the post or reply this post answers; every tagged member's delivery carries the reference.
          $ref: '#/components/schemas/ChatReply'

    GroupAction:
      type: object
      additionalProperties: false
      required: [type, requestId, action]
      properties:
        type:
          const: groupAction
        requestId:
          type: string
        action:
          type: string
          enum: [create, rename, delete, setMembers, systemLines]
        id:
          type: string
        name:
          type: string
        members:
          type: array
          items:
            type: string
        on:
          description: C4 - systemLines - the room's system lines on (true) or off (false).
          type: boolean

    ChatView:
      description: |
        The client opened (on=true) or closed one conversation of the office
        messenger (T-0043; the in-app chat view of T-0014). While open the
        server tails that lead's transcript and answers with `chatTranscript`:
        everything it holds when the view opens, then only what was appended.
        At most 4 open per client (more are ignored) and 12 transcript tails
        per daemon. Ignored unless the daemon runs with --allow-chat.
      type: object
      additionalProperties: false
      required: [type, agentId, on]
      properties:
        type:
          const: chatView
        agentId:
          type: integer
        on:
          type: boolean

    ChatHistory:
      description: |
        A bounded page strictly older than `before`, or the newest page when
        absent. `until` asks for the item at or before that time and ten older
        items of context, capped at 400. Privileged and --allow-chat only.
      type: object
      additionalProperties: false
      required: [type, agentId, requestId]
      properties:
        type:
          const: chatHistory
        agentId:
          type: integer
        requestId:
          type: string
        before:
          type: string
        until:
          type: number

    ChatSearch:
      description: |
        Search user and assistant text in the current and earlier sessions.
        A new request cancels this client's previous search.
      type: object
      additionalProperties: false
      required: [type, agentId, requestId, query]
      properties:
        type:
          const: chatSearch
        agentId:
          type: integer
        requestId:
          type: string
        query:
          type: string

    ChatItemKind:
      description: |
        `result` (a tool's output, trimmed) appears in `workContent` only, never
        in the messenger's `chatTranscript`.
      type: string
      enum: [user, assistant, tool, result]

    ChatSender:
      description: Who wrote a `user` item when it was not the boss (absent = the boss).
      type: string
      enum: [peer, system]

    ChatAttachment:
      description: |
        A file a lead sent (T-0105). `path` is the server's copy under the
        project's `.cld-outbox/` (absolute, as the project folder is known to
        clients), served through the usual file tickets; the sent file's own
        path never reaches a client. `unavailable` (no `path`): it could not be
        copied (missing, over 20 MB, not a regular file, a symlink, protected).
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
        sizeKb:
          type: number
        unavailable:
          type: boolean

    ChatItem:
      description: |
        One line of a conversation: user or assistant text, or one tool call
        (`toolName` and, in `text`, the provider's status line; `desc` is an
        optional agent-supplied tool description; the client shows it the EZ
        way). `id` starts with `at`, the record's time (ms
        since the epoch, 0 when the record has none), then `-`: ids compare
        by that time (a client's last-read mark). A message the boss sent
        through the app has its header line (`[사장 · 메신저 · …]`,
        `[사용자 · 앱(gui:…) · …]`) removed. A user-side item is the boss's
        unless `from` says otherwise (T-0087): `peer` (another orchestrator
        through `send`; `fromName` is its name) or `system` (a notice:
        Codex, the engine's recovery, an unnamed sender). The header line of
        those is removed too.
      type: object
      additionalProperties: false
      required: [kind, text, id, at]
      properties:
        kind:
          $ref: '#/components/schemas/ChatItemKind'
        text:
          type: string
        toolName:
          type: string
        desc:
          type: string
        id:
          type: string
        at:
          type: number
        session:
          description: Earlier transcript's session id (absent for the current session).
          type: string
        sessionStart:
          description: First record time of the earlier transcript, in milliseconds.
          type: number
        from:
          $ref: '#/components/schemas/ChatSender'
        fromName:
          description: The sender's name when `from` is `peer`.
          type: string
        execution:
          description: |
            MSG-UI2: on a background task's completion notice, the sub-agent
            run it reports (`claude:<spawn tool id>`, the key TempEmployee
            binds), so the client can show that temp employee's face.
          type: string
        employee:
          description: |
            MSG-ALIGN: the employee that run was bound to, resolved by the
            server from the roster (which keeps every run's employee), so the
            notice keeps its name and face after the employee is reused for a
            newer run or the page reloads. Only with `execution`, and only when
            the roster knows the run.
          $ref: '#/components/schemas/ChatEmployee'
        attachments:
          description: |
            Files the lead sent (T-0105): a `SendUserFile` call (`text` is its
            caption) or `[첨부] <path>` lines of its own text (removed from
            `text`). Only on an `assistant` item.
          type: array
          items:
            $ref: '#/components/schemas/ChatAttachment'
        messageId:
          description: |
            C2: the engine messenger's message id this item belongs to. On a
            `user` item, the mark ` ⟨m:<id>⟩` that ended our header line (the
            mark is removed from `text`); on the items after it, up to the next
            user turn, the message they answer. Absent for records without a
            mark (every history before C2), which pair by their text as before.
          type: string
        replyTo:
          description: |
            MSG-ACTIONS: the message a `user` item answers (its header carried
            ` ⟨re:<id>⟩` after the C2 mark and its body started with the quote
            line `> <sender>: <quote>`; both are removed from `text`).
          $ref: '#/components/schemas/ChatReply'

    ChatEmployee:
      description: 'MSG-ALIGN: a temp employee as a chat item names it (the roster keeps it per run).'
      type: object
      additionalProperties: false
      required: [employeeId, nameId]
      properties:
        employeeId:
          type: string
        nameId:
          type: string

    ChatReply:
      description: |
        MSG-ACTIONS (답글): a reference to the message a reply answers. `id` is
        the replied message's C2 message id when it has one, else the room
        post's id, else the chat item's `id`. `sender` is who wrote it (absent:
        the boss); `text` is a one-line quote of it (the server keeps the first
        120 characters, secrets masked).
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
        sender:
          type: string
        text:
          type: string

    WorkKind:
      type: string
      enum: [subagent, teammate]

    WorkView:
      description: |
        The client opened (on=true) or closed the read-only work view (T-0056)
        of one temp: a Claude sub-agent (`agentId`: its lead's character id,
        `id`: the spawn's tool_use id), a teammate (`agentId`: its own
        character id). While open the server follows its transcript and
        answers with `workContent`. Only for privileged clients and with
        --allow-chat; at most 2 open per client. Never an input: there is no
        way to send to a temp.
      type: object
      additionalProperties: false
      required: [type, kind, on]
      properties:
        type:
          const: workView
        kind:
          $ref: '#/components/schemas/WorkKind'
        agentId:
          type: integer
        id:
          type: string
        on:
          type: boolean

    WorkContent:
      description: |
        What a temp is doing (T-0056), to a client that has its `workView`
        open. A Claude temp: `items` (the task prompt, its text, tool calls and
        trimmed results; with `append: true` only what was written since, else
        replacing what the client holds). `error` (Korean) says why there is
        nothing to show. Every string is run through the secret masker first.
      type: object
      additionalProperties: false
      required: [type, kind, items]
      properties:
        type:
          const: workContent
        kind:
          $ref: '#/components/schemas/WorkKind'
        agentId:
          type: integer
        id:
          type: string
        title:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatItem'
        append:
          type: boolean
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    ChatTranscript:
      description: |
        The conversation of one lead's session, read from its transcript
        (T-0014, T-0043), oldest first. Without `append` (or false) `items`
        replace what the client holds (a view just opened, or the transcript
        started over); with `append: true` they follow it (only the lines
        written since). `canSend` is true when `chatSend` can reach the lead
        (chat is on, and it is an engine project);
        otherwise the view is read-only. `queued` (engine projects only): the
        boss's messages still waiting in the engine messenger's queue, all of
        them each time (also sent, with no items and `append`, when only it
        changed), so a reloaded client still shows them.
      type: object
      additionalProperties: false
      required: [type, agentId, items, canSend]
      properties:
        type:
          const: chatTranscript
        agentId:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatItem'
        canSend:
          type: boolean
        append:
          type: boolean
        queued:
          type: array
          items:
            $ref: '#/components/schemas/ChatQueued'

    ChatQueued:
      description: |
        One of the boss's messages waiting for an engine project's session:
        its queue id (`chatSendNow`), its text without the header, when it was
        sent (ms), and `now` once it may go in while the session works. An
        edited message carries `edited`; a just-cancelled one remains briefly
        with `cancelled` so every open messenger can show its final state.
        MSG-HOLD2: `held` while it is opened for editing; it is not delivered
        until a page decides (edit saved, edit cancelled, original approved).
      type: object
      additionalProperties: false
      required: [id, text, at]
      properties:
        id:
          type: string
        text:
          type: string
        at:
          type: number
        now:
          type: boolean
        edited:
          type: boolean
        cancelled:
          type: boolean
        held:
          type: boolean
        messageId:
          description: C2 - the message's id (the mark its header will carry).
          type: string
        replyTo:
          description: MSG-ACTIONS - the message it answers.
          $ref: '#/components/schemas/ChatReply'

    ChatHistoryResult:
      description: |
        A page of older conversation items, oldest first. `done` means no
        older item exists in this session or its previous-session chain.
      type: object
      additionalProperties: false
      required: [type, requestId, agentId, items, done]
      properties:
        type:
          const: chatHistoryResult
        requestId:
          type: string
        agentId:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatItem'
        done:
          type: boolean
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    ChatSearchKind:
      type: string
      enum: [user, assistant]

    ChatSearchHit:
      type: object
      additionalProperties: false
      required: [id, at, kind, snippet]
      properties:
        id:
          type: string
        at:
          type: number
        kind:
          $ref: '#/components/schemas/ChatSearchKind'
        snippet:
          type: string
        session:
          type: string
        sessionStart:
          type: number

    ChatSearchResult:
      description: |
        At most 50 matching text lines, newest first. `truncated` means the
        hit or byte budget was reached before the search finished.
      type: object
      additionalProperties: false
      required: [type, requestId, agentId, hits, truncated]
      properties:
        type:
          const: chatSearchResult
        requestId:
          type: string
        agentId:
          type: integer
        hits:
          type: array
          items:
            $ref: '#/components/schemas/ChatSearchHit'
        truncated:
          type: boolean
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    JobDigest:
      type: object
      additionalProperties: false
      required: [steps, lines]
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JobDigestStep'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JobDigestLine'

    JobDigestStep:
      type: object
      additionalProperties: false
      required: [name, state]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [done, running, failed, waiting]

    JobDigestLine:
      type: object
      additionalProperties: false
      required: [text, error]
      properties:
        text:
          type: string
        error:
          type: boolean

    MessengerContact:
      description: |
        One lead in the messenger's contact list: its last message (first
        line, at most 80 characters) and when, and the ids of its latest
        replies (assistant text, at most 50, oldest first) for the client's
        unread count. A lead whose transcript is not tailed (more than 12
        leads) has none of them.
      type: object
      additionalProperties: false
      required: [agentId, name, replies]
      properties:
        agentId:
          type: integer
        name:
          type: string
        project:
          description: |
            D3: a Worker's project. The messenger lists it in a collapsed
            Worker group under that project (= its Lead); absent for a Lead.
          type: string
        preview:
          type: string
        lastAt:
          type: number
        lastKind:
          $ref: '#/components/schemas/ChatItemKind'
        lastFrom:
          description: The last item's `from` (T-0087), so the list can name a sender that is not the boss.
          $ref: '#/components/schemas/ChatSender'
        lastFromName:
          type: string
        canSend:
          type: boolean
        held:
          description: |
            An engine project whose session waits on a question or permission
            only its terminal shows (`claude agents`: blocked): the boss's
            messages wait, untyped, until it is answered (터미널로 보기).
          type: boolean
        permission:
          $ref: '#/components/schemas/PermissionWait'
        room:
          description: |
            C3: the room whose post the lead's newest turn answers (its newest
            user turn is a room delivery). That turn is the room's, not this
            one-to-one conversation's: its end notifies for the room. Absent:
            a one-to-one turn, or none yet.
          type: string
        roomId:
          description: 'C3: the id of `room` (when the messenger typed the turn); a notice addresses the room by it.'
          type: string
        roomPost:
          description: 'C3: the id of the room post the turn answers; the room notices of one post are one notice.'
          type: string
        roomReply:
          $ref: '#/components/schemas/MessengerRoomReply'
        replies:
          type: array
          items:
            type: string

    MessengerRoomReply:
      description: |
        ROOM-NOTICE: a lead's newest text reply in its room turn, as a short
        masked one-line preview (what a push carries). A new `id` is a new
        reply: the client notifies "<room> - <lead>" with the text.
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
        text:
          type: string

    MessengerContacts:
      description: |
        The office messenger's contacts (T-0043): every lead (orchestrator,
        engine project, Claude session) with what its transcript
        last said. Sent while anyone watches, on change, and as a snapshot to
        each new client. Only with --allow-chat.
      type: object
      additionalProperties: false
      required: [type, contacts]
      properties:
        type:
          const: messengerContacts
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/MessengerContact'

    ChatSend:
      description: |
        One message for an engine project (T-0014, T-0043), through the engine
        messenger (T-0019: typed in when its session is idle, else queued,
        with the header `[사장 · 메신저 · <time>]`). Refused, without running
        anything, unless the daemon runs with --allow-chat, the client is
        privileged, the text is 1-20000 characters with no control characters
        but newline and tab, and `name` is an engine project. Answered with `chatSendResult` to the
        sender only. `now` (engine projects; Ctrl+Enter, 즉시): the message may
        also go in while the session works (Claude Code queues input typed
        during a turn), when its input line is empty and no dialog is up;
        without it the message waits until the session is idle.
      type: object
      additionalProperties: false
      required: [type, requestId, name, text]
      properties:
        type:
          const: chatSend
        requestId:
          type: string
        name:
          type: string
        text:
          type: string
        now:
          type: boolean
        replyTo:
          description: |
            MSG-ACTIONS (답글): the message this one answers. The header gets
            ` ⟨re:<id>⟩` after the C2 mark and the body starts with the quote
            line; ignored for a `/` command typed without a header.
          $ref: '#/components/schemas/ChatReply'

    ChatSendNow:
      description: |
        지금 보내기: the boss's queued message `id` (from `chatTranscript`'s
        `queued` or `chatSendResult`'s `queueId`) for engine project `name`
        becomes a `now` message. Privileged only. Answered with
        `chatSendResult` (`delivered: queued`: it goes in at the next check).
      type: object
      additionalProperties: false
      required: [type, requestId, name, id]
      properties:
        type:
          const: chatSendNow
        requestId:
          type: string
        name:
          type: string
        id:
          type: string

    ChatCancel:
      description: |
        Cancel a boss message that the Typist has not started to enter yet.
        The queue id may refer to the live queue or to the inbox kept for the
        session's next start. Privileged only; answered with
        `chatPendingResult` to the sender.
      type: object
      additionalProperties: false
      required: [type, requestId, name, id]
      properties:
        type:
          const: chatCancel
        requestId:
          type: string
        name:
          type: string
        id:
          type: string

    ChatEdit:
      description: |
        Replace a boss message that the Typist has not started to enter yet.
        The queue id may refer to the live queue or to the inbox kept for the
        session's next start. The text has the same validation as `chatSend`.
        Privileged only; answered with `chatPendingResult` to the sender.
      type: object
      additionalProperties: false
      required: [type, requestId, name, id, text]
      properties:
        type:
          const: chatEdit
        requestId:
          type: string
        name:
          type: string
        id:
          type: string
        text:
          type: string

    PermissionWait:
      description: |
        PERM-PROMPT: the engine session waits on a Claude Code permission
        dialog (`claude agents --json` says `waitingFor: permission prompt`).
        While someone views the conversation the daemon reads the dialog off
        the session's screen once per wait: `toolId` is then `screen:<hash>`,
        `tool` its title line and `detail` its other lines (masked), and an
        answer acts only on exactly that dialog. Otherwise `toolId` is the
        open tool call from the transcripts (its tool, its own description or
        its command's first line). `asker` is the staff name id of the
        sub-agent that asks, when one does. An answer names `toolId`; the
        daemon presses a key only when the dialog on screen is the card's.
      type: object
      additionalProperties: false
      required: [toolId]
      properties:
        toolId:
          type: string
        tool:
          type: string
        detail:
          type: string
        asker:
          type: string

    PermissionAnswer:
      description: |
        PERM-PROMPT: answer a permission dialog from the messenger (허용:
        "1. Yes", 거부: Esc). Privileged, like typing into that session's
        terminal; answered with `permissionAnswerResult` to its sender.
      type: object
      additionalProperties: false
      required: [type, requestId, agentId, toolId, allow]
      properties:
        type:
          const: permissionAnswer
        requestId:
          type: string
        agentId:
          type: integer
        toolId:
          type: string
        allow:
          type: boolean

    PermissionAnswerOutcome:
      type: string
      enum: [answered, noDialog, otherDialog, notCleared, gone, failed]

    PermissionAnswerResult:
      description: |
        PERM-PROMPT: what one `permissionAnswer` did. `result`: `answered`
        (the key went in and the dialog went away), `noDialog` / `otherDialog`
        (nothing sent: no permission dialog, or one about another call),
        `notCleared` (pressed, the dialog stayed), `gone` (no such wait any
        more), `failed` (no attach). A refusal has `ok: false` and `error`.
      type: object
      additionalProperties: false
      required: [type, requestId, agentId, ok]
      properties:
        type:
          const: permissionAnswerResult
        requestId:
          type: string
        agentId:
          type: integer
        ok:
          type: boolean
        result:
          $ref: '#/components/schemas/PermissionAnswerOutcome'
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    ChatHold:
      description: |
        Keep a queued boss message from reaching the Typist while it is edited.
        The hold belongs to this connection and ends when it closes. Privileged
        only; it has no reply.
      type: object
      additionalProperties: false
      required: [type, name, id, on]
      properties:
        type:
          const: chatHold
        name:
          type: string
        id:
          type: string
        on:
          type: boolean

    SlashCommands:
      description: Request the safe slash-command catalogue for an open engine conversation.
      type: object
      additionalProperties: false
      required: [type, requestId, agentId]
      properties:
        type:
          const: slashCommands
        requestId:
          type: string
        agentId:
          type: integer

    SlashCommandSource:
      type: string
      enum: [builtin, user, project]

    SlashCommand:
      type: object
      additionalProperties: false
      required: [name, description, source]
      properties:
        name:
          type: string
        args:
          type: string
        description:
          type: string
        source:
          $ref: '#/components/schemas/SlashCommandSource'
        confirm:
          type: boolean
        argsRequired:
          type: boolean

    SlashCommandsList:
      description: Safe slash commands for one messenger conversation. Sent again while it remains open when command folders change.
      type: object
      additionalProperties: false
      required: [type, requestId, agentId, commands]
      properties:
        type:
          const: slashCommandsList
        requestId:
          type: string
        agentId:
          type: integer
        commands:
          type: array
          maxItems: 300
          items:
            $ref: '#/components/schemas/SlashCommand'
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    ChatSendResult:
      description: |
        Answer to one `chatSend`. `delivered` (the engine messenger's):
        `pane` (typed in now), `queued` (typed in once the session is idle;
        the engine gives up after 10 minutes and moves it to the inbox) or
        `inbox` (the lead is off). `error` is the daemon's refusal (Korean). `queueId`: a message
        queued by the engine messenger, for `chatSendNow`.
      type: object
      additionalProperties: false
      required: [type, requestId, name, ok]
      properties:
        type:
          const: chatSendResult
        requestId:
          type: string
        name:
          type: string
        ok:
          type: boolean
        delivered:
          type: string
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        queueId:
          type: string
        messageId:
          description: C2 - the message's id; its transcript items carry the same `messageId`.
          type: string

    ChatPendingResult:
      description: |
        Answer to `chatCancel` or `chatEdit`, sent only to its requester.
        `error` is a Korean refusal; a Typist already entering the old text
        reports that it is already being typed.
      type: object
      additionalProperties: false
      required: [type, requestId, name, id, ok]
      properties:
        type:
          const: chatPendingResult
        requestId:
          type: string
        name:
          type: string
        id:
          type: string
        ok:
          type: boolean
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        gone:
          description: |
            MSG-HOLD2 - refused because the message no longer waits (it went
            in, or is going in now): an edit becomes a follow-up correction.
          type: boolean

    ErrorParams:
      description: Values for the {holes} of an `errorCode` text (core/src/cld/serverText.ts).
      type: object
      additionalProperties:
        type: [string, number]

    # ── cld-gui: who is watching (T-0025, T-0013) ────────────────

    ViewerVisibility:
      description: |
        The client's page was shown or hidden, and on every connect its state
        then. A hidden client (a background tab, an app sent to the background)
        is no viewer: with no visible client the daemon spawns and samples
        nothing (T-0013). Answered with `viewerVisibilityAck` to the sender
        only, which tells a client back in the foreground that its socket still
        works (iOS cuts a backgrounded home-screen app's network without
        closing the socket).
      type: object
      additionalProperties: false
      required: [type, visible]
      properties:
        type:
          const: viewerVisibility
        visible:
          type: boolean

    HwView:
      description: HW panel opened or closed on this socket; the daemon samples each second only while a visible viewer has it open.
      type: object
      additionalProperties: false
      required: [type, on]
      properties:
        type:
          const: hwView
        on:
          type: boolean

    ViewerVisibilityAck:
      description: Answer to one `viewerVisibility`, with the visibility the daemon now counts.
      type: object
      additionalProperties: false
      required: [type, visible]
      properties:
        type:
          const: viewerVisibilityAck
        visible:
          type: boolean

    # ── cld-gui: EZ phrase rules (FR-OFC-018, ADR-0014) ──────────

    EzRules:
      description: |
        The user's EZ phrase rules from ~/.config/cld-gui/ez-rules.json,
        checked by the daemon: only the valid entries, in file order. The
        screen tries them before its built-in table, so they add to it and
        override it. Sent after the handshake, and only when the file holds
        at least one valid rule; without it the built-in table alone applies.
      type: object
      additionalProperties: false
      required: [type, tools, commands]
      properties:
        type:
          const: ezRules
        tools:
          type: array
          items:
            $ref: '#/components/schemas/EzToolRule'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/EzCommandRule'
        fatigue:
          $ref: '#/components/schemas/EzFatigue'

    EzFatigue:
      description: |
        The user's fatigue (피로도) numbers (T-0026, T-0045), each replacing the
        screen's default: fatigue is exactly the context fill in percent
        (contextTokens / maxContextTokens); compactions are shown beside it as
        "압축 N/M" (N is the engine's count, else the context drops of more than
        `compactionDrop` points; M is the project's own `compactionNudge` for
        engine projects, and absent otherwise). From `tired` percent a character
        sweats and walks slower, from `yawn` it yawns now and then, and from
        `rest` percent it asks for a rest (N reaching M only highlights
        "압축 N/M", T-0047).
      type: object
      additionalProperties: false
      properties:
        compactionDrop:
          type: integer
        tired:
          type: integer
        yawn:
          type: integer
        rest:
          type: integer

    EzToolRule:
      description: One agent tool, matched by name ignoring case and punctuation, and the phrase it gets (`text` is at most 16 characters).
      type: object
      additionalProperties: false
      required: [tool, emoji, text]
      properties:
        tool:
          type: array
          items:
            type: string
        emoji:
          type: string
        text:
          type: string

    EzCommandRule:
      description: |
        One shell command and the phrase it gets (`text` is at most 16
        characters). `program` is the command's file name (python3.11 reads
        as python). The other lists narrow it, and every list given must
        match: `sub` (the first argument that is not an option is one of
        these), `subContains` (it contains one of these), `has` (all of these
        are among the arguments), `contains` (one of these is inside an
        argument).
      type: object
      additionalProperties: false
      required: [program, emoji, text]
      properties:
        program:
          type: array
          items:
            type: string
        sub:
          type: array
          items:
            type: string
        subContains:
          type: array
          items:
            type: string
        has:
          type: array
          items:
            type: string
        contains:
          type: array
          items:
            type: string
        emoji:
          type: string
        text:
          type: string

    # ── cld-gui: built-in engine (T-0018) ────────────────────────
    # Projects whose orchestrator runs as a Claude Code background session
    # (`claude --bg`), without tmux (ADR-0013). Sent only while the
    # daemon runs the engine (--engine on or auto).

    EngineState:
      description: |
        Every registered project, re-sent in full on every change and to each
        new client. `live`: a running Claude Code session (its pid alive, read
        from ~/.claude/sessions) holds the project's conversation or, in the
        background, its name in its folder; `bgId` is that background
        session's id. Actions are enabled when officeSnapshot.readOnly
        is false. `warnings` (Korean): e.g. the Claude daemon carries another
        session's variables, or projects.json could not be read.
      type: object
      additionalProperties: false
      required: [type, projects]
      properties:
        type:
          const: engineState
        projects:
          type: array
          items:
            $ref: '#/components/schemas/EngineProject'
        warnings:
          type: array
          items:
            type: string
        agentChoices:
          $ref: '#/components/schemas/InstalledAgentChoices'

    AgentChoices:
      type: object
      additionalProperties: false
      required: [models, efforts]
      properties:
        version:
          type: string
        models:
          type: array
          items:
            type: string
        efforts:
          type: array
          items:
            type: string
        permissionModes:
          description: The --permission-mode choices the CLI's own help lists (D3b's Worker form).
          type: array
          items:
            type: string
        defaultModel:
          type: string
        defaultEffort:
          type: string

    InstalledAgentChoices:
      description: Read-only choices found in installed Claude Code and Codex public configuration; credentials are never read.
      type: object
      additionalProperties: false
      properties:
        claude:
          $ref: '#/components/schemas/AgentChoices'
        codex:
          $ref: '#/components/schemas/AgentChoices'

    EngineProject:
      description: |
        `room` is the room it shows in: its own, else the folder's basename.
        The launch options (`rulesFile`, `model`, `permissionMode`, `effort`,
        `remoteControl`, `title` = the conversation's name) are only set when
        the user chose them; unset means Claude Code's own default (ADR-0014).
        A new Lead whose add names no `model`/`effort` gets the Leads' common
        pair, else the installed CLI's top ones (core/src/cld/leadDefaults.ts).
        `wantRunning` is set by start and cleared by stop; the engine revives
        such projects when the daemon starts. `needsTrust`: the session waits
        on Claude's folder trust question, which only a person answers.
        `trusting` (AUTO-TRUST): the engine is answering that question in
        Claude's own dialog right now, because a person pressed 켜기.
        `downNote` (T-0091): the engine's watch gave up reviving the session
        after it died again and again (a crash loop); it stays down until a
        person starts it. The text is the mark with the last error.
        `compactionNudge` (T-0019, opt-in): from this many compactions of the
        conversation on, the engine sends it the renew nudge.
        `alwaysOn` keeps a remotely controlled project up when Claude Code
        retires it for idleness; false or absent leaves it resting until a
        message or a person starts it.
        D3: the list holds every agent: each project's Lead (named as the
        project) and its Workers, which carry `role` and `project` (their
        project's name) and show in their project's room.
      type: object
      additionalProperties: false
      required: [name, folder, room, wantRunning, live]
      properties:
        compactionNudge:
          type: integer
        name:
          type: string
        role:
          $ref: '#/components/schemas/WorkerRole'
        project:
          description: D3 — a Worker's project (its Lead's name); absent for a Lead.
          type: string
        folder:
          type: string
        room:
          type: string
        rulesFile:
          type: string
        model:
          type: string
        permissionMode:
          type: string
        effort:
          type: string
        remoteControl:
          type: boolean
        alwaysOn:
          type: boolean
        title:
          type: string
        wantRunning:
          type: boolean
        live:
          type: boolean
        bgId:
          type: string
        sessionId:
          type: string
        needsTrust:
          type: boolean
        trusting:
          type: boolean
        downNote:
          type: string
        provider:
          description: D5 — the agent's provider when it is not Claude (`codex`, or an id this build lacks).
          type: string

    EngineActionKind:
      type: string
      enum: [add, edit, remove, start, stop, restart, promote]

    EngineOldLead:
      description: promote (D3b) only, what the old Lead becomes; worker when unset.
      type: string
      enum: [worker, stop]

    WorkerRole:
      description: |
        D3: an agent of a project besides its Lead, with its own session,
        token, character, DM, queue and inbox, addressed by its own name.
      type: string
      enum: [worker, reviewer]

    EngineAction:
      description: |
        One engine action. Refused in Korean, without running `claude`, unless
        the daemon runs with --allow-actions and the client is privileged, the
        project exists (add: the name is new and valid), and no other action
        for it is running; accepted actions run one at a time. add and edit
        take `folder`, `room` and the launch options of `EngineProject` (edit:
        only the changed ones; an empty string clears a text option, false
        clears remoteControl); `mkdir` lets add or edit create a missing
        folder after the user agreed. Answered with `engineActionResult` to
        the sender only.
        D3: add with `role` and `project` adds a Worker of that project under
        `name` (unique among every project and agent); its optional `folder`
        (a worktree) must be inside the project's repository, and it takes
        no `room` (its project's). The other actions name a Worker by its
        own name; removing a project removes its Workers.
        D3b: promote makes the Worker `name` its project's Lead. Names are
        slots: the promoted Worker answers to the project's name from then
        on, the old Lead takes the Worker's former name and becomes a Worker
        (`oldLead: worker`, the default: its conversation resumed) or stays
        stopped (`oldLead: stop`). The project's chat, rooms, mentions and
        `cld-gui send <project>` reach the new Lead; Tasks and records stay.
      type: object
      additionalProperties: false
      required: [type, requestId, action, name]
      properties:
        type:
          const: engineAction
        requestId:
          type: string
        action:
          $ref: '#/components/schemas/EngineActionKind'
        name:
          type: string
        role:
          $ref: '#/components/schemas/WorkerRole'
        project:
          type: string
        folder:
          type: string
        room:
          type: string
        rulesFile:
          type: string
        model:
          type: string
        permissionMode:
          type: string
        effort:
          type: string
        remoteControl:
          type: boolean
        alwaysOn:
          type: boolean
        title:
          type: string
        mkdir:
          type: boolean
        compactionNudge:
          description: add and edit (T-0019); 0 turns the nudge off.
          type: integer
        oldLead:
          $ref: '#/components/schemas/EngineOldLead'
        provider:
          description: |
            D5, add of a Worker only: its agent provider (`claude` when unset, or `codex`
            when it is installed here). A Codex Worker takes `model`, `effort` and `folder`;
            the Claude-only options are refused. Not changeable by edit.
          type: string

    EngineChoicesRefresh:
      description: Re-read installed CLI public configuration for the orchestrator form.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: engineChoicesRefresh

    ProjectScan:
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type: { const: projectScan }
        requestId: { type: string }
        folder: { type: string }

    ProjectImportCandidate:
      type: object
      additionalProperties: false
      required: [folder, name, room, live, already]
      properties:
        folder: { type: string }
        name: { type: string }
        room: { type: string }
        sessionId: { type: string }
        lastActivity: { type: string }
        title: { type: string }
        live: { type: boolean }
        branch: { type: string }
        already: { type: boolean }

    ProjectScanResult:
      type: object
      additionalProperties: false
      required: [type, requestId, ok, candidates]
      properties:
        type: { const: projectScanResult }
        requestId: { type: string }
        ok: { type: boolean }
        error: { type: string }
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        candidates:
          type: array
          items: { $ref: '#/components/schemas/ProjectImportCandidate' }

    ProjectImportRow:
      type: object
      additionalProperties: false
      required: [folder, name, room, resume, start]
      properties:
        folder: { type: string }
        name: { type: string }
        room: { type: string }
        resume: { type: boolean }
        start: { type: boolean }

    ProjectImport:
      type: object
      additionalProperties: false
      required: [type, requestId, folder, rows]
      properties:
        type: { const: projectImport }
        requestId: { type: string }
        folder: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProjectImportRow' }

    ProjectImportUndo:
      type: object
      additionalProperties: false
      required: [type, requestId, batchId]
      properties:
        type: { const: projectImportUndo }
        requestId: { type: string }
        batchId: { type: string }

    ProjectImportDismiss:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { const: projectImportDismiss }

    ProjectImportSuggestion:
      type: object
      additionalProperties: false
      required: [type, folder]
      properties:
        type: { const: projectImportSuggestion }
        folder: { type: string }

    ProjectImportItemResult:
      type: object
      additionalProperties: false
      required: [folder, name, status]
      properties:
        folder: { type: string }
        name: { type: string }
        status: { type: string, enum: [added, skipped, failed, removed] }
        reason: { type: string }
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    ProjectImportResult:
      type: object
      additionalProperties: false
      required: [type, requestId, rows]
      properties:
        type: { const: projectImportResult }
        requestId: { type: string }
        batchId: { type: string }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ProjectImportItemResult' }

    EngineActionResult:
      description: |
        Answer to one `engineAction`. `bgId` is the background session after a
        start or restart, `note` something the user should know although it
        worked (Korean: e.g. a fresh conversation because the old one had no
        transcript), `error` the refusal or failure (Korean), `folderMissing`
        that add can create the folder when asked again with `mkdir`.
      type: object
      additionalProperties: false
      required: [type, requestId, action, name, ok]
      properties:
        type:
          const: engineActionResult
        requestId:
          type: string
        action:
          $ref: '#/components/schemas/EngineActionKind'
        name:
          type: string
        ok:
          type: boolean
        bgId:
          type: string
        note:
          type: string
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        folderMissing:
          type: boolean

    JobActionKind:
      type: string
      enum: [log, stop]

    JobAction:
      description: |
        The job panel on one of the engine's jobs (T-0019): `log` reads the
        last 64 KB of its log (each line as the terminal last showed it),
        `stop` sends its process groups SIGTERM. Both need a privileged
        client; `stop` also needs --allow-actions (the client confirms
        first). Starting jobs is only for the local `cld-gui` CLI. Answered
        with `jobActionResult` to the sender only.
      type: object
      additionalProperties: false
      required: [type, requestId, action, id]
      properties:
        type:
          const: jobAction
        requestId:
          type: string
        action:
          $ref: '#/components/schemas/JobActionKind'
        id:
          type: string

    JobActionResult:
      description: |
        Answer to one `jobAction`: `log` and `truncated` for a log, `error`
        (Korean) for a refusal or failure.
      type: object
      additionalProperties: false
      required: [type, requestId, action, id, ok]
      properties:
        type:
          const: jobActionResult
        requestId:
          type: string
        action:
          $ref: '#/components/schemas/JobActionKind'
        id:
          type: string
        ok:
          type: boolean
        log:
          type: string
        logPath:
          type: string
        truncated:
          type: boolean
        digest:
          $ref: '#/components/schemas/JobDigest'
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    # ── cld-gui: floors (T-0027) ─────────────────────────────────
    # The office as a building of floors, kept in
    # ~/.config/cld-gui/building.json. Floor 1 is the generated office plus decor. Floor
    # changes are cosmetic: any logged-in client may make them, also on a
    # read-only daemon.

    BuildingState:
      description: |
        The building, floor 1 first, re-sent in full to every client on every
        change (after the layoutLoaded it changes) and to each new client.
        Where each floor is in the office is the layout's (layoutLoaded):
        `rooms` are the rooms on a floor by label (an engine project's room, the 관리실, a
        project folder's room); `characters` the characters placed there
        apart from their room, by name. `perProject`: 프로젝트마다 층, every
        room not placed yet gets a floor of its own. `error` (Korean, to the
        sender only): why its last floor change was not made.
      type: object
      additionalProperties: false
      required: [type, floors, perProject]
      properties:
        type:
          const: buildingState
        floors:
          type: array
          items:
            $ref: '#/components/schemas/BuildingFloor'
        perProject:
          type: boolean
        decor:
          description: 'Rooms with decor; stored: furniture kept in 보관함 because it does not fit now.'
          type: array
          items:
            $ref: '#/components/schemas/BuildingDecor'
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    BuildingDecor:
      type: object
      additionalProperties: false
      required: [room, stored]
      properties:
        room:
          type: string
        stored:
          type: integer

    ResetRoomDecor:
      description: |
        자동 배치로 되돌리기: forget one room's decor (tiles, furniture, removed
        generator items; the office-wide wall colour stays). `room` is the
        area label. Answered by layoutLoaded and buildingState to everyone.
      type: object
      additionalProperties: false
      required: [type, room]
      properties:
        type: { const: resetRoomDecor }
        room: { type: string }

    WhiteboardMemos:
      description: |
        The memos written on the office's whiteboards (T-0065), by furniture uid:
        every memo, sent at `webviewReady` and to everyone when one changes.
        Read-only clients get it too, it is what the office shows. A whiteboard
        without an entry has no memo.
      type: object
      additionalProperties: false
      required: [type, memos]
      properties:
        type: { const: whiteboardMemos }
        memos:
          type: array
          items:
            $ref: '#/components/schemas/WhiteboardMemo'

    WhiteboardMemo:
      type: object
      additionalProperties: false
      required: [uid, text, updatedAt]
      properties:
        uid: { type: string }
        text: { type: string }
        updatedAt: { type: integer, description: Epoch milliseconds. }

    SetWhiteboardMemo:
      description: |
        Write (or, with empty text, erase) the memo on one whiteboard. `uid` must
        be a WHITEBOARD in the current office; `text` is trimmed and at most 600
        characters. Privileged; answered by `whiteboardMemos` to everyone.
      type: object
      additionalProperties: false
      required: [type, uid, text]
      properties:
        type: { const: setWhiteboardMemo }
        uid: { type: string }
        text: { type: string }

    PinnedConversations:
      description: |
        The conversations the boss pinned to the top of the messenger (U-30):
        every pin, sent at `webviewReady` and to everyone when one changes, so
        phone and PC agree. A key is a contact's name or `room:<id>` (the keys
        of the messenger's read marks).
      type: object
      additionalProperties: false
      required: [type, keys]
      properties:
        type: { const: pinnedConversations }
        keys:
          type: array
          items: { type: string }

    SetConversationPin:
      description: |
        Pin (or unpin) one conversation. Privileged; answered by
        `pinnedConversations` to everyone.
      type: object
      additionalProperties: false
      required: [type, key, pinned]
      properties:
        type: { const: setConversationPin }
        key: { type: string }
        pinned: { type: boolean }
    TaskBoard:
      description: |
        작업 현황 (DEV-BOARD): every reported task of every project
        (~/.config/cld-gui/tasks.json), sent at `webviewReady` and to everyone
        when one changes. `corrupt` says the tasks file could not be read: it is
        kept untouched and nothing is saved until it is fixed. `error` goes only
        to the sender of a refused `taskEdit`. Observed items (Codex runs, jobs)
        are not here: the client reads them from `codexTasks` and `officeJobs`.
        No percentage or ETA exists (F-15).
      type: object
      additionalProperties: false
      required: [type, tasks]
      properties:
        type: { const: taskBoard }
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/BoardTask'
        corrupt: { type: string }
        error: { type: string }
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        removedAssignees:
          type: array
          description: |
            D6: the assignment ids some task's assignee holds that no agent has
            any more (shown as "(삭제됨) <name>"); absent when none or unknown.
          items: { type: string }

    TrackedItems:
      description: |
        U-48 phase 1: one project's tracked items, read-only and derived from what
        the agents themselves wrote -- the sessions, the task lists Claude Code keeps
        under ~/.claude/tasks/<sessionId>/ and the CODEX_PROGRESS.md checklists of the
        engine's Codex worktrees. Sent only while someone views, and only for a project
        whose items changed (an empty `items` means the project has none now). Titles
        only: 200 characters, secrets masked; no description or body ever travels, and
        the same goes for remote devices. Never stored: the index is rebuilt from the
        sources. These items are not Tasks, so no progress count includes them.
      type: object
      additionalProperties: false
      required: [type, project, items]
      properties:
        type: { const: trackedItems }
        project: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackedItem'
        more:
          type: array
          description: How many children a parent holds beyond the 30 sent.
          items:
            $ref: '#/components/schemas/TrackedMore'

    TrackedMore:
      type: object
      additionalProperties: false
      required: [parentKey, count]
      properties:
        parentKey: { type: string }
        count: { type: integer }

    TrackedItem:
      type: object
      additionalProperties: false
      required: [key, kind, title, status, source]
      properties:
        key:
          type: string
          description: 'Stable within its source: session:<sessionId>, claude-task:<sessionId>/<id>, codex-progress:<codexId>#<n>, doc:<project>/<path> (a document) and doc:<project>/<path>#<id or h:hash> (an item of it).'
        kind:
          $ref: '#/components/schemas/TrackedKind'
        parentKey:
          type: string
          description: The session item (agentList), the engine's Codex run key `codex:<id>` (codexProgress), or the document or heading item (doc) it sits under. A document item has none.
        title:
          type: string
          description: One line, 200 characters at most, masked. Empty for an unreadable list.
        status:
          $ref: '#/components/schemas/TrackedStatus'
        rawStatus:
          type: string
          description: The source's own word (in_progress, [ ], blockedBy), at most 40 characters.
        source:
          $ref: '#/components/schemas/BoardFactSource'
        reporter:
          type: string
          description: The agent that wrote a reported status (its session's name).
        ref:
          type: string
          description: Where it was seen, never a project-absolute path (a session id prefix, ~/.claude/tasks/<id8>/<n>.json, CODEX_PROGRESS.md).
        changedAt:
          type: [string, 'null']
          description: The source file's mtime (a session has none unless it has a list).
        taskId:
          type: string
          description: |
            The exact MCP Task id (T-<n>) found in the title; for a doc item, the id it
            defines (first table cell, heading start, file name, front-matter `id:`).
            The only link to a Task card.
        ended:
          type: boolean
          description: A session that is no longer running (status unknown, the work may not be over).
        unreadable:
          type: boolean
          description: A list whose format this build does not read (or a document over the size cap); shown as one line.
        path:
          type: string
          description: A doc item's file, relative to its project folder.
        line:
          type: integer
          description: A doc item's line in its file (1-based).
        refs:
          type: array
          description: |
            The ids a doc item names (its own definition included). A mention only
            links, it never makes an item; on a document item, the ids named in its
            prose outside any item.
          items: { type: string }
        duplicate:
          type: boolean
          description: Another document of the same project defines the same id; both are kept.
        gone:
          type: boolean
          description: Vanished from its source (kept for a day, in memory only).

    TrackedKind:
      type: string
      enum: [session, agentList, codexProgress, doc]

    TrackedStatus:
      type: string
      enum: [todo, doing, review, blocked, done, cancelled, unknown]

    TrackingSettings:
      description: |
        U-48 phase 2a: a project's document sources. Without `settings` and `hide`
        it only asks for the lists (the settings were opened: the only time the
        project's git is asked for recently changed documents). `settings` replaces
        the project's stored settings; `hide` adds one item key to the hidden ones.
        Privileged; answered by `trackingSources` to the sender.
      type: object
      additionalProperties: false
      required: [type, project]
      properties:
        type: { const: trackingSettings }
        project: { type: string }
        settings:
          $ref: '#/components/schemas/TrackingProjectSettings'
        hide: { type: string }

    TrackingProjectSettings:
      type: object
      additionalProperties: false
      required: [on, off, shortIds, hidden]
      properties:
        on:
          type: array
          description: Paths or globs (`*`, `?` within one name) relative to the project folder, at most 20.
          items: { type: string }
        off:
          type: array
          description: Conventional documents turned off (their paths).
          items: { type: string }
        shortIds:
          type: boolean
          description: Short ids like D5 or C3 count as ids in this project.
        hidden:
          type: array
          description: Item keys hidden from the board.
          items: { type: string }

    TrackingSources:
      description: |
        U-48 phase 2a: the reply to `trackingSettings`: the project's stored settings
        (~/.config/cld-gui/tracking.json), the documents found (conventional ones and
        the ones turned on), and the "켤까요?" candidates (Markdown files the project's
        git changed in the last 7 days that hold checkboxes, a status table or a
        front-matter status; a suggestion only). `error` says why a change was refused.
      type: object
      additionalProperties: false
      required: [type, project, settings, found, candidates]
      properties:
        type: { const: trackingSources }
        project: { type: string }
        settings:
          $ref: '#/components/schemas/TrackingProjectSettings'
        found:
          type: array
          items:
            $ref: '#/components/schemas/TrackingDoc'
        candidates:
          type: array
          items: { type: string }
        error: { type: string }
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    TrackingDoc:
      type: object
      additionalProperties: false
      required: [path, conventional, on]
      properties:
        path: { type: string }
        conventional:
          type: boolean
          description: Found by its conventional name (on unless turned off).
        on: { type: boolean }
        items:
          type: integer
          description: How many items the last read found (absent when not read).

    BoardTask:
      type: object
      additionalProperties: false
      required: [id, project, title, status, source, createdAt, updatedAt, history]
      properties:
        id: { type: string, description: 'Given (S4, U-15) or generated T-<n>.' }
        project: { type: string }
        title: { type: string }
        detail: { type: string }
        status:
          $ref: '#/components/schemas/BoardTaskStatus'
        priority:
          $ref: '#/components/schemas/BoardTaskPriority'
        goal: { type: string, description: One of the release sub-goals. }
        owner:
          $ref: '#/components/schemas/BoardTaskOwner'
        branch: { type: string }
        worktree: { type: string }
        links:
          type: array
          items:
            $ref: '#/components/schemas/BoardTaskLink'
        note: { type: string }
        source:
          $ref: '#/components/schemas/BoardTaskSource'
        externalRef:
          $ref: '#/components/schemas/BoardTaskExternalRef'
        createdAt: { type: string }
        updatedAt: { type: string }
        history:
          type: array
          description: The last 50 changes.
          items:
            $ref: '#/components/schemas/BoardTaskChange'
        parentId: { type: string, description: 'D6: the parent task (any depth; the board shows one level).' }
        assignee:
          $ref: '#/components/schemas/BoardTaskAssignee'
        createdBy: { type: string, description: "D6: user | agent:<name> | cli; absent on tasks from before D6." }
        delegatedBy: { type: string, description: D6, the agent that gave the task to its assignee. }
        statusSource:
          $ref: '#/components/schemas/BoardFactSource'
        reportedDone:
          $ref: '#/components/schemas/BoardFactBool'
        commits:
          $ref: '#/components/schemas/BoardFactNumber'
        filesChanged:
          $ref: '#/components/schemas/BoardFactNumber'
        testsRan:
          $ref: '#/components/schemas/BoardFactBool'
        testsPassed:
          $ref: '#/components/schemas/BoardFactBool'
        executions:
          type: array
          description: D6, the runs attached to the task (Codex tasks, jobs, C6 delegations to an agent), oldest first.
          items:
            $ref: '#/components/schemas/BoardExecution'
        budget:
          $ref: '#/components/schemas/BoardTaskBudget'

    BoardTaskBudget:
      type: object
      additionalProperties: false
      description: |
        C6: a delegated task's budget. Checked when delegating (a child's budget
        fits in what its parent has left); turns and minutes are enforced at
        runtime by K2.
      properties:
        maxTurns: { type: integer }
        maxMinutes: { type: integer }

    BoardFactSource:
      type: string
      description: |
        D6 (B §7): observed = the daemon measured it (process, git, records);
        reported = someone said so (CLI, an agent's token, the office);
        inferred = a guess (a log string, a timer); unknown = nobody knows.
      enum: [observed, reported, inferred, unknown]

    BoardFactBool:
      type: object
      additionalProperties: false
      required: [value, source, at]
      properties:
        value: { type: boolean }
        source:
          $ref: '#/components/schemas/BoardFactSource'
        at: { type: string }

    BoardFactNumber:
      type: object
      additionalProperties: false
      required: [value, source, at]
      properties:
        value: { type: number }
        source:
          $ref: '#/components/schemas/BoardFactSource'
        at: { type: string }

    BoardFactTime:
      type: object
      additionalProperties: false
      required: [value, source, at]
      properties:
        value: { type: string }
        source:
          $ref: '#/components/schemas/BoardFactSource'
        at: { type: string }

    BoardFactText:
      type: object
      additionalProperties: false
      required: [value, source, at]
      properties:
        value: { type: string }
        source:
          $ref: '#/components/schemas/BoardFactSource'
        at: { type: string }

    BoardFactLimit:
      type: object
      additionalProperties: false
      required: [value, source, at]
      description: A usage-limit stop; `resetAt` when the run said when it resets.
      properties:
        value:
          $ref: '#/components/schemas/BoardLimitValue'
        source:
          $ref: '#/components/schemas/BoardFactSource'
        at: { type: string }

    BoardLimitValue:
      type: object
      additionalProperties: false
      properties:
        resetAt: { type: string }

    BoardTaskAssignee:
      type: object
      additionalProperties: false
      required: [assignmentId, name]
      description: An engine agent, kept by its assignment id; `name` is for display.
      properties:
        assignmentId: { type: string }
        name: { type: string }

    BoardExecutionKind:
      type: string
      enum: [codex, job, agent]

    BoardExecution:
      type: object
      additionalProperties: false
      required: [id, kind, ref]
      description: |
        One run of a task. `ref` is the Codex task id, the engine job id or
        the assignment id. `startedAt` is when it was attached (or, for a
        link made before D6, the record's start once seen); the facts are
        what the daemon recorded when it ended.
      properties:
        id: { type: string }
        kind:
          $ref: '#/components/schemas/BoardExecutionKind'
        ref: { type: string }
        startedAt: { type: string }
        endedAt:
          $ref: '#/components/schemas/BoardFactTime'
        exit:
          $ref: '#/components/schemas/BoardFactNumber'
        commits:
          $ref: '#/components/schemas/BoardFactNumber'
        log: { type: string }
        limit:
          $ref: '#/components/schemas/BoardFactLimit'
        summary:
          $ref: '#/components/schemas/BoardFactText'
          description: D5 — a Codex Worker run's last message (its report, reported), at most 2,000 characters.

    BoardTaskStatus:
      type: string
      enum: [proposed, todo, doing, review, blocked, done]

    BoardTaskPriority:
      type: string
      enum: [P0, P1, P2, later]

    BoardTaskSource:
      type: string
      description: reported = someone said so; observed = the engine saw it.
      enum: [reported, observed]

    BoardTaskOwnerKind:
      type: string
      enum: [lead, worker, subagent, codex, user, unassigned]

    BoardTaskLinkKind:
      type: string
      enum: [codex, job, url]

    BoardTaskOwner:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          $ref: '#/components/schemas/BoardTaskOwnerKind'
        name: { type: string }

    BoardTaskLink:
      type: object
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind:
          $ref: '#/components/schemas/BoardTaskLinkKind'
        ref: { type: string, description: A Codex task id, an engine job id, or a URL. }

    BoardTaskExternalRef:
      type: object
      additionalProperties: false
      required: [system, key]
      description: Reserved for a later Jira/CollabOps sync (none now).
      properties:
        system: { type: string }
        key: { type: string }
        url: { type: string }

    BoardTaskChange:
      type: object
      additionalProperties: false
      required: [at, by, change]
      properties:
        at: { type: string }
        by: { type: string }
        change: { type: string }

    TaskEdit:
      description: |
        Add a task (no `id`; `fields` needs project and title) or change one
        (status, owner, priority, note) from the office. Privileged; answered by
        `taskBoard` to everyone, or, refused, by `taskBoard` with `error` to the
        sender. An empty priority or note clears it.
      type: object
      additionalProperties: false
      required: [type, fields]
      properties:
        type: { const: taskEdit }
        id: { type: string }
        fields:
          $ref: '#/components/schemas/TaskEditFields'

    DelegationApprovals:
      description: |
        C6: the delegate_task calls waiting for the user's approval
        (~/.config/cld-gui/approvals.json), sent at `webviewReady` and to
        everyone when the list changes. With `requestId` it answers that
        screen's `delegationDecision`: `error` says why nothing happened
        (`stepup`: prove this device first), `outcome` is the re-run call's
        status when it was approved.
      type: object
      additionalProperties: false
      required: [type, approvals]
      properties:
        type: { const: delegationApprovals }
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/DelegationApproval'
        requestId: { type: string }
        error: { type: string }
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        outcome: { type: string }
        taskId: { type: string }

    DelegationApproval:
      type: object
      additionalProperties: false
      required: [id, project, caller, check, why, title, target, newWorker, createdAt]
      properties:
        id: { type: string }
        project: { type: string }
        caller: { type: string, description: The agent that called delegate_task. }
        check:
          $ref: '#/components/schemas/DelegationCheck'
        why: { type: string, description: The check's reason, in plain words. }
        title: { type: string }
        target: { type: string, description: The Worker's name, or the new Worker's provider. }
        newWorker: { type: boolean, description: Approving starts a new managed Worker (needs a fresh step-up from a remote device). }
        createdAt: { type: string }
        counts:
          $ref: '#/components/schemas/DelegationCounts'

    DelegationCounts:
      type: object
      additionalProperties: false
      description: The project's counts now, each [used, limit] (B §9.4-7).
      required: [workersRunning, hostWorkersRunning, newWorkersToday, delegationsToday]
      properties:
        workersRunning: { type: array, items: { type: integer } }
        hostWorkersRunning: { type: array, items: { type: integer } }
        newWorkersToday: { type: array, items: { type: integer } }
        delegationsToday: { type: array, items: { type: integer } }

    DelegationDecision:
      description: |
        C6: approve or deny a waiting delegation. Privileged; approving one
        that starts a new Worker needs a fresh step-up on a remote device.
        Answered by `delegationApprovals` with the same `requestId`.
      type: object
      additionalProperties: false
      required: [type, requestId, id, decision]
      properties:
        type: { const: delegationDecision }
        requestId: { type: string }
        id: { type: string }
        decision:
          $ref: '#/components/schemas/DelegationDecisionKind'
        reason: { type: string }
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'

    DelegationCheck:
      type: string
      description: The check that asked for approval (B §9.4-5 mode, 9.4-7 limits).
      enum: [mode, limits]

    DelegationDecisionKind:
      type: string
      enum: [approve, deny]

    TaskEditFields:
      type: object
      additionalProperties: false
      properties:
        project: { type: string }
        title: { type: string }
        status:
          $ref: '#/components/schemas/BoardTaskStatus'
        priority: { type: string }
        owner:
          $ref: '#/components/schemas/BoardTaskOwner'
        note: { type: string }

    BuildingFloor:
      type: object
      additionalProperties: false
      required: [id, name, rooms, characters]
      properties:
        id:
          type: string
        name:
          type: string
        rooms:
          type: array
          items:
            type: string
        characters:
          type: array
          items:
            type: string

    AddFloor:
      description: |
        Add a floor on top, at most 9 (the 1-9 keys). `name` defaults to
        "<number>층". Answered by `buildingState`.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addFloor
        name:
          type: string

    RenameFloor:
      description: Rename a floor (1-24 characters). Answered by `buildingState`.
      type: object
      additionalProperties: false
      required: [type, floorId, name]
      properties:
        type:
          const: renameFloor
        floorId:
          type: string
        name:
          type: string

    RemoveFloor:
      description: |
        Remove a floor other than floor 1. Its rooms and characters move to
        floor 1. Answered by `buildingState`.
      type: object
      additionalProperties: false
      required: [type, floorId]
      properties:
        type:
          const: removeFloor
        floorId:
          type: string

    MoveToFloor:
      description: |
        Put a room (`room`, its label) or a character (`character`, its name)
        on a floor; exactly one of the two. A character put on its room's
        floor follows its room again. This changes
        only the building, never a project's room. Answered by `buildingState`.
      type: object
      additionalProperties: false
      required: [type, floorId]
      properties:
        type:
          const: moveToFloor
        floorId:
          type: string
        room:
          type: string
        character:
          type: string

    SetFloorRule:
      description: |
        프로젝트마다 층 on or off. While on, every room not placed on a floor
        gets one of its own (the first goes to floor 1 while that holds no
        room). Turning it off moves nothing. Answered by `buildingState`.
      type: object
      additionalProperties: false
      required: [type, perProject]
      properties:
        type:
          const: setFloorRule
        perProject:
          type: boolean

    # ── cld-gui: project folders (T-0032) ────────────────────────
    # Folders are written the host's way (Windows, WSL, macOS, Linux). The
    # webview and the daemon read a typed folder with the same pure rules
    # (core/src/cld/projectPath.ts); the daemon checks again before use.

    HostInfo:
      description: |
        The daemon's host, sent once after `webviewReady` (every /ws client is
        logged in). `os` wsl is Linux under WSL. `pathStyle`/`sep`: how its
        folders are written. `caseInsensitive`: its file system folds case
        (found once by stat-ing the home folder with its case flipped).
        `distro` (WSL): the distribution, for `\\wsl.localhost\<distro>\…`;
        `mnt` (WSL): where the Windows drives are mounted. `utcOffsetMin`:
        the host's local time zone, minutes east of UTC when sent, so every
        client reads office hours (T-0041) on the host's clock.
      type: object
      additionalProperties: false
      required: [type, os, home, pathStyle, sep, caseInsensitive]
      properties:
        type:
          const: hostInfo
        os:
          $ref: '#/components/schemas/HostOs'
        home:
          type: string
        pathStyle:
          $ref: '#/components/schemas/PathStyle'
        sep:
          type: string
        caseInsensitive:
          type: boolean
        distro:
          type: string
        mnt:
          type: string
        utcOffsetMin:
          type: integer

    HostOs:
      type: string
      enum: [linux, wsl, darwin, win32]

    PathStyle:
      type: string
      enum: [posix, win32]

    ListFolders:
      description: |
        The folder picker: the subfolders of `path` (absent: the home folder).
        Refused in Korean unless the daemon runs with --allow-actions and the
        client is privileged. Only folders under the home folder, a Windows
        drive or (WSL) a /mnt drive are listed, symlinks are never followed
        out of them, hidden folders only with `hidden`, at most 500 entries,
        and never a file name or content. Answered with `folderList` to the
        sender only.
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          const: listFolders
        requestId:
          type: string
        path:
          type: string
        hidden:
          type: boolean

    FolderList:
      description: |
        Answer to one `listFolders`. `path` is the listed folder (normalized),
        `display` how the host's other side writes it (WSL: the Windows path),
        `parent` the folder above it while that is still allowed (null at a
        root), `roots` the places to start from (home, drives), `entries` its
        subfolders by name, `truncated` when more than 500 were cut, `warnings`
        what the user should know (Korean, e.g. a slow /mnt drive). `ok`
        false: `error` says why (Korean).
      type: object
      additionalProperties: false
      required: [type, requestId, ok, roots, entries]
      properties:
        type:
          const: folderList
        requestId:
          type: string
        ok:
          type: boolean
        error:
          type: string
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
        path:
          type: string
        display:
          type: string
        parent:
          type: [string, 'null']
        roots:
          type: array
          items:
            $ref: '#/components/schemas/FolderRoot'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FolderEntry'
        truncated:
          type: boolean
        warnings:
          type: array
          items:
            type: string

    FolderRoot:
      type: object
      additionalProperties: false
      required: [label, path]
      properties:
        label:
          type: string
        path:
          type: string

    FolderEntry:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    # T-0044: HTTP /api/cld/files contract. These shapes are shared with the
    # webview; routes, authentication and limits are documented in
    # cld/docs/design/project-files.md.
    ProjectFileEntry:
      type: object
      additionalProperties: false
      required: [name, path, kind, size, mtime]
      properties:
        name: { type: string }
        path: { type: string }
        kind: { type: string, enum: [file, directory] }
        size: { type: number }
        mtime: { type: number }

    ProjectFileList:
      type: object
      additionalProperties: false
      required: [path, entries, offset, nextOffset]
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ProjectFileEntry' }
        offset: { type: integer }
        nextOffset: { type: [integer, 'null'] }

    ProjectFilePreview:
      type: object
      additionalProperties: false
      required: [path, kind, size, truncated]
      properties:
        path: { type: string }
        kind: { type: string, enum: [image, markdown, text, csv, json, pdf, html, download] }
        size: { type: number }
        truncated: { type: boolean }
        text: { type: string }

    ProjectRecentFiles:
      type: object
      additionalProperties: false
      required: [entries, partial, ignored]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/ProjectFileEntry' }
        partial: { type: boolean }
        ignored:
          type: array
          items: { type: string }
    # ── cld-gui: Web Push (T-0039, FR-NTF-001/002/004/006, IR-PUSH-001) ──
    # One subscription per device (its device-key id, else its session
    # handle), kept 0600 in ~/.config/cld-gui/push.json with the daemon's
    # VAPID keys. The daemon pushes the enabled kinds only while that device
    # has no visible client. The payload is the notice's title and body, the
    # character id and a url: never transcript text. Endpoints are capability
    # URLs and are never logged.

    NoticeKind:
      type: string
      enum: [turnEnd, attention, job, reply]

    PushSubscribe:
      description: |
        This device wants Web Push (or changed which kinds): the browser's
        PushSubscription (`endpoint` must be https; `p256dh` the 65-byte P-256
        key and `auth` the 16-byte secret, both base64url) and the device's
        notice settings. Privileged connections only; replaces the device's
        previous subscription. Answered with `pushState`.
      type: object
      additionalProperties: false
      required: [type, endpoint, p256dh, auth, kinds, subagents]
      properties:
        type:
          const: pushSubscribe
        endpoint:
          type: string
        p256dh:
          type: string
        auth:
          type: string
        kinds:
          type: array
          items:
            $ref: '#/components/schemas/NoticeKind'
        kindsOff:
          description: |
            U-49: the kinds the user turned off. Sent by every client that knows `reply`
            (message pushes), so the daemon can tell "off" from "saved before this kind
            existed" (a row without it is the old shape: `reply` is on, the other kinds
            are as `kinds` says).
          type: array
          items:
            $ref: '#/components/schemas/NoticeKind'
        subagents:
          type: boolean
        remoteTurnEnds:
          description: |
            FR-NTF-006: also push turn ends of orchestrators with remote-control
            on (the Claude app pushes those too). Absent: true.
          type: boolean
        lang:
          description: |
            I1: the language this device reads (`en` or `ko`), so a push is worded in it.
            Absent: Korean, as before.
          type: string
          enum: [en, ko]

    PushUnsubscribe:
      description: This device wants no more Web Push. Answered with `pushState`.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: pushUnsubscribe

    PushState:
      description: |
        Web Push for this connection's device, sent after `webviewReady` and as
        the answer to `pushSubscribe`/`pushUnsubscribe`. `available` false:
        push is off on this daemon (its push.json could not be read) or this
        connection may not subscribe; `publicKey` is the VAPID application
        server key (base64url). `error`: why the last request was refused.
      type: object
      additionalProperties: false
      required: [type, available, publicKey, subscribed]
      properties:
        type:
          const: pushState
        available:
          type: boolean
        publicKey:
          type: [string, 'null']
        subscribed:
          type: boolean
        error:
          type: [string, 'null']
        errorCode:
          type: string
        errorParams:
          $ref: '#/components/schemas/ErrorParams'
